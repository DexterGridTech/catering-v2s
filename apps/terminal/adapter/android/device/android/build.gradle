plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.catering.v2s.terminal.adapter.android.device'
version = '0.1.0'

android {
  namespace "com.catering.v2s.terminal.adapter.android.device"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
