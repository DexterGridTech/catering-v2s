plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.catering.v2s.terminal.adapter.android.dualscreen'
version = '0.1.0'

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core-ktx:1.17.0'
}

android {
  namespace "com.catering.v2s.terminal.adapter.android.dualscreen"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
