plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.catering.v2s.terminal.adapter.android.persistkv'
version = '0.1.0'

dependencies {
  implementation 'com.tencent:mmkv:2.4.2'
  testImplementation 'junit:junit:4.13.2'
}

android {
  namespace "com.catering.v2s.terminal.adapter.android.persistkv"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
