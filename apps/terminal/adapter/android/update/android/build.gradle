plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.catering.v2s.terminal.adapter.android.update'
version = '0.1.0'

android {
  namespace "com.catering.v2s.terminal.adapter.android.update"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("com.facebook.react:react-android")
  implementation("com.squareup.okhttp3:okhttp:4.9.2")
  testImplementation 'junit:junit:4.13.2'
}
