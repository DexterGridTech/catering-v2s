plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.catering.v2s.terminal.assembly.base.android'
version = '0.1.0'

android {
  namespace "com.catering.v2s.terminal.assembly.base.android"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("com.facebook.react:react-android")
  // The base module owns the Android HTTP/WS host adapter. Keeping the
  // dependency here makes the module's compile contract truthful; app-level
  // declarations remain explicit for the two Expo hosts.
  implementation("org.nanohttpd:nanohttpd-websocket:2.3.1")
  testImplementation 'junit:junit:4.13.2'
}
