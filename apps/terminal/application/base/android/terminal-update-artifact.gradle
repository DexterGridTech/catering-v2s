import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.nio.charset.StandardCharsets
import org.gradle.api.DefaultTask
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.OutputDirectory

abstract class TerminalPublicationMetadataTask extends DefaultTask {
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()
}

def terminalPublicationMetadata = providers.gradleProperty('terTerminalPublicationMetadata')

// Expo inlines EXPO_PUBLIC_* into Metro bundles. Include a hash of those
// inputs in both bundle tasks without persisting their values (the automation
// token is among them), or Gradle can reuse a bundle built for another stage.
def terminalExpoPublicEnvironment = System.getenv().entrySet()
    .findAll { entry -> entry.key.startsWith('EXPO_PUBLIC_') }
    .sort { left, right -> left.key <=> right.key }
    .collect { entry -> "${entry.key.length()}:${entry.key}${entry.value.length()}:${entry.value}" }
    .join('|')
def terminalExpoPublicEnvironmentSha256 = MessageDigest.getInstance('SHA-256')
    .digest(terminalExpoPublicEnvironment.getBytes(StandardCharsets.UTF_8))
    .encodeHex()
    .toString()

tasks.configureEach { task ->
    if (task.name == 'createBundleReleaseJsAndAssets' || task.name == 'createBundleDebugJsAndAssets') {
        task.inputs.property('terExpoPublicEnvironmentSha256', terminalExpoPublicEnvironmentSha256)
    }
}

if (terminalPublicationMetadata.isPresent()) {
    android.sourceSets.main.assets.srcDir(file(terminalPublicationMetadata.get()).parentFile)
} else if (providers.gradleProperty('terDisableNativeDevSupport').map { value -> value.toBoolean() }.getOrElse(false)) {
    // A self-contained managed APK runs the same update boot checks as an
    // installed build. Give each supported variant a manifest for its embedded
    // bundle so startup validates the payload instead of crashing on a missing asset.
    def metadataAsset = 'terminal-update-publication.json'
    def appPackageFile = new File(rootDir.parentFile, 'package.json')
    def appPackage = new JsonSlurper().parse(appPackageFile)
    def appRelease = appPackage.terminalRelease
    def automationApplicationId = android.defaultConfig.applicationId +
        providers.gradleProperty('terAutomationApplicationIdSuffix').getOrElse('')
    def automationNativeBuildNumber = providers.gradleProperty('terTerminalNativeBuildNumber')
        .map { value -> value.toLong() }
        .getOrElse((appRelease.nativeBuildNumber as Number).longValue())
    def automationBundleVersion = providers.gradleProperty('terTerminalBundleVersion')
        .getOrElse(appRelease.bundleVersion.toString())
    androidComponents.onVariants(androidComponents.selector().all()) { variant ->
        def variantName = variant.name
        if (!(variantName in ['debug', 'release'])) return
        def variantTitle = variantName.capitalize()
        def metadataDirectory = layout.buildDirectory.dir("generated/terminal-update/${variantName}-assets")
        def bundleFile = layout.buildDirectory.file("generated/assets/react/${variantName}/index.android.bundle")
        def identitySource = [
            'TERMINAL_AUTOMATION_EMBEDDED_IDENTITY_V1',
            variantName,
            automationApplicationId,
            appPackage.version.toString(),
            automationNativeBuildNumber.toString(),
            automationBundleVersion.toString(),
            appRelease.runtimeVersion.toString(),
        ].join('\u0000')
        // This is a schema-valid identity for a run-built app, not a published
        // update artifact. The embedded bundle still has its own SHA-256 entry.
        def embeddedIdentityId = MessageDigest.getInstance('SHA-256')
            .digest(identitySource.getBytes(StandardCharsets.UTF_8))
            .encodeHex()
            .toString()
        def publicationId = providers.gradleProperty('terTerminalPublicationId').getOrElse(embeddedIdentityId)
        android.buildTypes.getByName(variantName).manifestPlaceholders['terminalPublicationId'] = publicationId

        def generateMetadata = tasks.register("generateTerminal${variantTitle}PublicationMetadata", TerminalPublicationMetadataTask) {
            outputDirectory.set(metadataDirectory)
            dependsOn(tasks.named("createBundle${variantTitle}JsAndAssets"))
            inputs.file(bundleFile)
            inputs.file(appPackageFile)
            inputs.property('applicationId', automationApplicationId)
            inputs.property('nativeBuildNumber', automationNativeBuildNumber)
            inputs.property('nativeVersion', appPackage.version.toString())
            inputs.property('bundleVersion', automationBundleVersion.toString())
            inputs.property('runtimeVersion', appRelease.runtimeVersion.toString())
            inputs.property('publicationId', publicationId)
            doLast {
                def bundle = bundleFile.get().asFile
                if (!bundle.isFile() || bundle.length() <= 0) {
                    throw new GradleException("TERMINAL_UPDATE_${variantName.toUpperCase()}_EMBEDDED_BUNDLE_MISSING")
                }
                def digest = MessageDigest.getInstance('SHA-256')
                bundle.withInputStream { stream ->
                    byte[] buffer = new byte[1024 * 1024]
                    int count
                    while ((count = stream.read(buffer)) >= 0) {
                        if (count > 0) digest.update(buffer, 0, count)
                    }
                }
                def metadata = [
                    schemaVersion: 1,
                    platform: 'android',
                    applicationId: automationApplicationId,
                    nativeVersion: appPackage.version.toString(),
                    nativeBuildNumber: automationNativeBuildNumber,
                    bundleVersion: automationBundleVersion.toString(),
                    runtimeVersion: appRelease.runtimeVersion.toString(),
                    entry: 'assets/index.android.bundle',
                    files: [[
                        path: 'assets/index.android.bundle',
                        sizeBytes: bundle.length(),
                        sha256: digest.digest().encodeHex().toString(),
                    ]],
                    publicationId: publicationId,
                ]
                def output = outputDirectory.file(metadataAsset).get().asFile
                output.parentFile.mkdirs()
                output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(metadata)) + '\n', 'UTF-8')
                logger.lifecycle("TERMINAL_AUTOMATION_EMBEDDED_METADATA_READY variant=${variantName} bundleBytes=${bundle.length()} publication=${publicationId}")
            }
        }
        variant.sources.assets.addGeneratedSourceDirectory(generateMetadata) { task -> task.outputDirectory }
    }
}

// React Native autolinking stores native codegen paths under each package's
// android/build directory. In a managed artifact run the real Gradle build
// directory is run-scoped, so expose that directory through a temporary link.
// The registry is written before links are created so runner cleanup can remove
// only links owned by this run, including after an interrupted Gradle process.
def terminalArtifactManagedBuildDirectory = providers.gradleProperty('terAutomationBuildDir')
if (terminalArtifactManagedBuildDirectory.isPresent()) {
    def runBuildDirectory = new File(terminalArtifactManagedBuildDirectory.get()).canonicalFile
    def terminalNodeModules = new File(rootDir, '../../../../node_modules').canonicalFile
    def runRoot = new File(rootDir, '../../../../../../.runtime/terminal-automation').canonicalFile
    if (!runBuildDirectory.path.startsWith(runRoot.path + File.separator)) {
        throw new GradleException('TERMINAL_AUTOMATION_ANDROID_BUILD_DIRECTORY_OUTSIDE_RUN')
    }

    // The managed runner links android/build to this run's root build directory.
    // React Native 0.86.3's settings plugin writes autolinking there, and its
    // project plugin reads the run-owned root build directory. Some managed
    // artifact builds use that link directly; other managed Gradle entrypoints
    // keep the settings output in the Android project and need a run-owned copy.
    def settingsRootBuildDirectory = new File(rootDir, 'build').canonicalFile
    def runRootBuildDirectory = new File(runBuildDirectory, 'root').canonicalFile
    def settingsAutolinkingDirectory = new File(settingsRootBuildDirectory, 'generated/autolinking').canonicalFile
    def projectAutolinkingDirectory = new File(runRootBuildDirectory, 'generated/autolinking').canonicalFile
    def autolinkingAlreadyRunOwned = settingsAutolinkingDirectory.path == projectAutolinkingDirectory.path
    if ((!autolinkingAlreadyRunOwned &&
         !settingsAutolinkingDirectory.path.startsWith(rootDir.canonicalPath + File.separator)) ||
        !projectAutolinkingDirectory.path.startsWith(runBuildDirectory.path + File.separator)) {
        throw new GradleException('TERMINAL_AUTOMATION_REACT_NATIVE_AUTOLINKING_PATH_OUTSIDE_OWNER')
    }
    def verifyAutolinkingFiles = { directory, failureCode ->
        def expectedInputs = ['autolinking.json', 'package.json.sha']
        if (!java.nio.file.Files.isDirectory(directory.toPath()) ||
            java.nio.file.Files.isSymbolicLink(directory.toPath()) ||
            expectedInputs.any { name ->
                def input = new File(directory, name)
                !java.nio.file.Files.isRegularFile(input.toPath()) ||
                    java.nio.file.Files.isSymbolicLink(input.toPath())
            }) {
            throw new GradleException(failureCode)
        }
    }
    def prepareAutolinkingInputs
    if (autolinkingAlreadyRunOwned) {
        prepareAutolinkingInputs = tasks.register('verifyTerminalAutomationReactNativeAutolinking') {
            doFirst {
                verifyAutolinkingFiles(projectAutolinkingDirectory,
                    'TERMINAL_AUTOMATION_REACT_NATIVE_AUTOLINKING_INPUT_UNAVAILABLE')
                logger.lifecycle('TERMINAL_AUTOMATION_REACT_NATIVE_AUTOLINKING_INPUTS_VERIFIED')
            }
        }
    } else {
        prepareAutolinkingInputs = tasks.register(
            'stageTerminalAutomationReactNativeAutolinking',
            org.gradle.api.tasks.Sync
        ) { task ->
            from(settingsAutolinkingDirectory) {
                include 'autolinking.json', 'package.json.sha'
            }
            into(projectAutolinkingDirectory)
            doFirst {
                verifyAutolinkingFiles(settingsAutolinkingDirectory,
                    'TERMINAL_AUTOMATION_REACT_NATIVE_AUTOLINKING_INPUT_UNAVAILABLE')
                logger.lifecycle('TERMINAL_AUTOMATION_REACT_NATIVE_AUTOLINKING_STAGE_STARTED')
            }
            doLast {
                verifyAutolinkingFiles(projectAutolinkingDirectory,
                    'TERMINAL_AUTOMATION_REACT_NATIVE_AUTOLINKING_STAGE_READBACK_FAILED')
                logger.lifecycle('TERMINAL_AUTOMATION_REACT_NATIVE_AUTOLINKING_STAGE_COMPLETE')
            }
        }
    }
    [
        'generateAutolinkingNewArchitectureFiles',
        'generateAutolinkingPackageList',
        'generateReactNativeEntryPoint',
    ].each { taskName ->
        tasks.named(taskName).configure { task ->
            task.dependsOn(prepareAutolinkingInputs)
        }
    }

    gradle.projectsEvaluated {
        def registrations = []
        rootProject.allprojects.each { candidate ->
            def moduleDirectory = candidate.projectDir.canonicalFile
            def modulePath = moduleDirectory.path
            if (moduleDirectory.name == 'android' &&
                modulePath.startsWith(terminalNodeModules.path + File.separator) &&
                candidate.plugins.hasPlugin('com.android.library')) {
                def outputDirectory = candidate.layout.buildDirectory.get().asFile.canonicalFile
                if (!outputDirectory.path.startsWith(runBuildDirectory.path + File.separator)) {
                    throw new GradleException('TERMINAL_AUTOMATION_ANDROID_MODULE_BUILD_DIRECTORY_OUTSIDE_RUN')
                }
                // Expo SDK 57 writes inline-module sources during Gradle
                // configuration through node_modules/expo/android/build.
                // That path is a temporary symlink to this run-owned target;
                // make the target exist before exposing the symlink, or Node's
                // recursive mkdir follows a dangling link and exits with ENOENT.
                java.nio.file.Files.createDirectories(outputDirectory.toPath())
                if (!java.nio.file.Files.isDirectory(outputDirectory.toPath())) {
                    throw new GradleException('TERMINAL_AUTOMATION_ANDROID_MODULE_BUILD_DIRECTORY_UNAVAILABLE')
                }
                def buildLink = new File(moduleDirectory, 'build')
                registrations.add([path: buildLink.path, target: outputDirectory.path])
            }
        }

        def registry = new File(runBuildDirectory, 'temporary-source-build-links.json')
        registry.parentFile.mkdirs()
        def registryTemporary = new File(runBuildDirectory, 'temporary-source-build-links.json.tmp')
        registryTemporary.text = JsonOutput.toJson(registrations)
        java.nio.file.Files.move(
            registryTemporary.toPath(),
            registry.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING,
            java.nio.file.StandardCopyOption.ATOMIC_MOVE
        )
        registrations.each { registration ->
            def link = new File(registration.path)
            if (java.nio.file.Files.exists(link.toPath(), java.nio.file.LinkOption.NOFOLLOW_LINKS)) {
                throw new GradleException('TERMINAL_AUTOMATION_ANDROID_MODULE_BUILD_PATH_OCCUPIED')
            }
        }
        registrations.each { registration ->
            def link = new File(registration.path)
            java.nio.file.Files.createSymbolicLink(link.toPath(), new File(registration.target).toPath())
        }
    }
}
