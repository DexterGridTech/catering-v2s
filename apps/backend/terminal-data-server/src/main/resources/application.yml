spring:
  datasource:
    hikari:
      connection-timeout: 2000
      connection-init-sql: SET statement_timeout TO 4000
      data-source-properties:
        connectTimeout: 2
        socketTimeout: 5

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        readiness:
          include: readinessState

v2s:
  tds:
    node-id: terminal-data-server
    readiness-withdrawal-wait-ms: 3000
    heartbeat-interval-ms: 30000
    heartbeat-timeout-ms: 90000
    state-write-interval-ms: 15000
    drain-window-ms: 10000
