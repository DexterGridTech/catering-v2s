spring:
  mvc:
    async:
      # Keep the response lifetime above the TER download client's 120s deadline.
      request-timeout: 130s
  datasource:
    url: ${CATERING_BUSINESS_DB_URL}
    username: ${CATERING_BUSINESS_DB_USERNAME:}
    password: ${CATERING_BUSINESS_DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 258MB
  flyway:
    locations: classpath:db/migration
    default-schema: public
platform:
  otp:
    debug-code-exposure: ${CATERING_OTP_DEBUG_CODE_EXPOSURE:false}
  iam:
    rate-limit-hmac-secret: ${CATERING_PLATFORM_RATE_LIMIT_HMAC_SECRET:}
workspace-iam:
  rate-limit-hmac-secret: ${CATERING_WORKSPACE_RATE_LIMIT_HMAC_SECRET:}
v2s:
  runtime-environment: ${V2S_RUNTIME_ENVIRONMENT:}
  dev-profile: ${V2S_DEV_PROFILE:}
  dev-namespace: ${V2S_DEV_NAMESPACE:}
  terminal:
    browser-allowed-origins: ${V2S_TERMINAL_BROWSER_ALLOWED_ORIGINS:}
  seed:
    fixed-otp-value: ${V2S_SEED_OTP_FIXED_VALUE:}
catering:
  terminal-update:
    android-build-tools-directory: ${TERMINAL_UPDATE_ANDROID_BUILD_TOOLS_DIRECTORY:}
