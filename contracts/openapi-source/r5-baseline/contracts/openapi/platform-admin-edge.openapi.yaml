openapi: 3.0.3
info:
  title: Platform Admin Edge API
  version: 0.1.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /
paths:
  /api/platform/group-workspaces/{workspaceKey}/contract-overview:
    get:
      summary: Read the audited contract overview page
      operationId: getPlatformContractOverviewPage
      tags: [PlatformContractOverview]
      security: [{platformSessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/GroupWorkspacePathKey'}
        - {name: contractNo, in: query, schema: {type: string, maxLength: 120}}
        - {name: storeName, in: query, schema: {type: string, maxLength: 120}}
        - {name: phaseName, in: query, schema: {type: string, maxLength: 120}}
        - {name: tenantName, in: query, schema: {type: string, maxLength: 120}}
        - {name: itemCode, in: query, schema: {type: string, maxLength: 120}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/StoreContractStatus'}}
        - {name: sort, in: query, schema: {$ref: '#/components/schemas/StoreContractSortKey', default: UPDATED_AT}}
        - {name: direction, in: query, schema: {$ref: '#/components/schemas/StoreContractSortDirection', default: DESC}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Contract overview page, content: {application/json: {schema: {$ref: '#/components/schemas/ContractOverviewPage'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '503': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/group-workspaces/{workspaceKey}/contract-overview/{contractId}:
    get:
      summary: Read a contract overview detail
      operationId: getPlatformContractOverviewDetail
      tags: [PlatformContractOverview]
      security: [{platformSessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/GroupWorkspacePathKey'}
        - {name: contractId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        '200': {description: Contract overview detail, content: {application/json: {schema: {$ref: '#/components/schemas/ContractOverviewItem'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
        '503': {$ref: '#/components/responses/PlatformProblem'}
  /api/operations/workspaces/{workspaceKey}/login-entry:
    get:
      summary: Read the keyed operations login entry
      operationId: getOperationsWorkspaceLoginEntry
      tags: [OperationsWorkspaceSession]
      security: []
      parameters: [{$ref: '#/components/parameters/WorkspaceLoginPathKey'}]
      responses:
        '200': {description: Workspace-owned login entry, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceLoginEntry'}}}}
        '404': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
  /api/operations/workspaces/{workspaceKey}/password-login:
    post:
      summary: Login to the operations workspace with an account password
      operationId: operationsWorkspacePasswordLogin
      tags: [OperationsWorkspaceSession]
      security: []
      parameters: [{$ref: '#/components/parameters/WorkspaceLoginPathKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspacePasswordLoginRequest'}}}}
      responses:
        '200': {description: Authenticated workspace session, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceSessionEntry'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '429': {$ref: '#/components/responses/PlatformRateLimitedProblem'}
  /api/operations/workspaces/{workspaceKey}/otp/send:
    post:
      summary: Send a workspace OTP for operations login
      operationId: sendOperationsWorkspaceOtp
      tags: [OperationsWorkspaceSession]
      security: []
      parameters: [{$ref: '#/components/parameters/WorkspaceLoginPathKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceOtpSendRequest'}}}}
      responses:
        '200': {description: OTP delivery receipt, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceOtpSendResponse'}}}}
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '429': {$ref: '#/components/responses/PlatformRateLimitedProblem'}
  /api/operations/workspaces/{workspaceKey}/otp/verify:
    post:
      summary: Verify a workspace OTP and establish operations session
      operationId: verifyOperationsWorkspaceOtp
      tags: [OperationsWorkspaceSession]
      security: []
      parameters: [{$ref: '#/components/parameters/WorkspaceLoginPathKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceOtpVerifyRequest'}}}}
      responses:
        '200': {description: Authenticated workspace session, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceSessionEntry'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '429': {$ref: '#/components/responses/PlatformRateLimitedProblem'}
  /api/operations/workspaces/{workspaceKey}/session/entry:
    get:
      summary: Read the current operations workspace entry
      operationId: getOperationsWorkspaceSessionEntry
      tags: [OperationsWorkspaceSession]
      security: [{operationsSessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/WorkspaceLoginPathKey'}]
      responses:
        '200': {description: Current workspace session entry, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceSessionEntry'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
  /api/operations/workspaces/{workspaceKey}/session/context:
    post:
      summary: Select the current operations workspace identity
      operationId: selectOperationsWorkspaceSessionContext
      tags: [OperationsWorkspaceSession]
      security: [{operationsSessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/WorkspaceLoginPathKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceSelectContextRequest'}}}}
      responses:
        '200': {description: Selected workspace context, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceSessionEntry'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
  /api/operations/workspaces/{workspaceKey}/session/password:
    post:
      summary: Change the current operations account password
      operationId: changeCurrentWorkspacePassword
      tags: [OperationsWorkspaceSession]
      security: [{operationsSessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/WorkspaceLoginPathKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceCurrentPasswordChangeRequest'}}}}
      responses:
        '200': {description: Password changed and sessions revoked, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceCurrentPasswordChangeResult'}}}}
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
  /api/operations/workspaces/{workspaceKey}/session/data-node:
    post:
      summary: Select the current operations data node
      operationId: selectOperationsWorkspaceSessionDataNode
      tags: [OperationsWorkspaceSession]
      security: [{operationsSessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/WorkspaceLoginPathKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceSelectDataNodeRequest'}}}}
      responses:
        '200': {description: Selected data node, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceSessionEntry'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
  /api/operations/workspaces/{workspaceKey}/logout:
    post:
      summary: Log out of the operations workspace
      operationId: operationsWorkspaceLogout
      tags: [OperationsWorkspaceSession]
      security: [{operationsSessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/WorkspaceLoginPathKey'}]
      responses:
        '204': {description: Workspace session revoked and cookie cleared}
        '401': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/group-workspaces/{workspaceKey}:
    get:
      summary: Read one group workspace for the platform administrator
      operationId: getPlatformGroupWorkspaceDetail
      tags: [PlatformWorkspace]
      security:
        - platformSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GroupWorkspacePathKey'
      responses:
        '200':
          description: Workspace facts returned by the platform workspace owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupWorkspaceDetail'
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
        '503': {$ref: '#/components/responses/PlatformProblem'}
    patch:
      summary: Update group workspace display facts
      operationId: updatePlatformGroupWorkspaceDisplay
      tags: [PlatformWorkspace]
      security:
        - platformSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GroupWorkspacePathKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupWorkspaceDisplayUpdateRequest'
      responses:
        '200':
          description: Updated workspace owner readback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupWorkspaceDetail'
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
    post:
      summary: Enable or disable a group workspace
      operationId: transitionPlatformGroupWorkspaceStatus
      tags: [PlatformWorkspace]
      security:
        - platformSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GroupWorkspacePathKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupWorkspaceStatusTransitionRequest'
      responses:
        '200':
          description: Updated workspace status and audit projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupWorkspaceDetail'
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/group-workspaces/{workspaceKey}/organization-overview:
    get:
      summary: Read the audited organization overview page
      operationId: getPlatformOrganizationOverviewPage
      tags: [PlatformOrganizationOverview]
      security:
        - platformSessionCookie: []
      parameters:
        - {$ref: '#/components/parameters/GroupWorkspacePathKey'}
        - {name: category, in: query, required: true, schema: {$ref: '#/components/schemas/OrganizationOverviewCategory'}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/OrganizationOverviewType'}}
        - {name: name, in: query, schema: {type: string, maxLength: 160}}
        - {name: code, in: query, schema: {type: string, maxLength: 120}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/OrganizationOverviewStatus'}}
        - {name: source, in: query, schema: {$ref: '#/components/schemas/OrganizationOverviewSource'}}
        - {name: projectId, in: query, schema: {type: string, maxLength: 64}}
        - {name: brandId, in: query, schema: {type: string, maxLength: 64}}
        - {name: tenantId, in: query, schema: {type: string, maxLength: 64}}
        - {name: sort, in: query, schema: {$ref: '#/components/schemas/OrganizationOverviewSortKey', default: UPDATED_AT}}
        - {name: direction, in: query, schema: {$ref: '#/components/schemas/OrganizationOverviewSortDirection', default: DESC}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Audited organization overview page, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationOverviewPage'}}}}
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
        '503': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/group-workspaces/{workspaceKey}/organization-overview/{category}/{itemId}:
    get:
      summary: Read one audited organization overview detail
      operationId: getPlatformOrganizationOverviewDetail
      tags: [PlatformOrganizationOverview]
      security:
        - platformSessionCookie: []
      parameters:
        - {$ref: '#/components/parameters/GroupWorkspacePathKey'}
        - {name: category, in: path, required: true, schema: {$ref: '#/components/schemas/OrganizationOverviewCategory'}}
        - {name: itemId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        '200': {description: Audited organization overview detail, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationOverviewItem'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
        '503': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/group-workspaces/{workspaceKey}/commercial-group:
    post:
      summary: Initialize the commercial group root for a group workspace
      operationId: initializePlatformCommercialGroupRoot
      tags: [PlatformWorkspace]
      security:
        - platformSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GroupWorkspacePathKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialGroupInitializeRequest'
      responses:
        '201':
          description: Commercial group root owner readback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialGroupRoot'
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
        '502': {$ref: '#/components/responses/PlatformProblem'}
        '503': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/workspaces/{workspaceKey}/roles:
    get:
      summary: List workspace business roles
      operationId: getWorkspaceRoles
      tags: [WorkspaceRole]
      security: [{platformSessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/GroupWorkspacePathKey'}
        - {$ref: '#/components/parameters/RoleName'}
        - {$ref: '#/components/parameters/RoleOrganizationType'}
        - {$ref: '#/components/parameters/RoleStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Workspace role owner readback, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceRolePage'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
    post:
      summary: Create a workspace business role
      operationId: createWorkspaceRole
      tags: [WorkspaceRole]
      security: [{platformSessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/GroupWorkspacePathKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceRoleCreateRequest'}}}}
      responses:
        '201': {description: Created workspace role, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceRole'}}}}
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/workspaces/{workspaceKey}/role-candidates:
    get:
      summary: Read complete enabled business-role candidates for page authorization
      operationId: getWorkspaceRoleCandidates
      tags: [WorkspaceRole]
      security: [{platformSessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/GroupWorkspacePathKey'}]
      responses:
        '200': {description: Complete enabled business-role owner snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceRoleCandidateCatalog'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/workspaces/{workspaceKey}/roles/{roleId}:
    patch:
      summary: Update a workspace business role
      operationId: updateWorkspaceRole
      tags: [WorkspaceRole]
      security: [{platformSessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/GroupWorkspacePathKey'}
        - {$ref: '#/components/parameters/RolePathId'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceRoleUpdateRequest'}}}}
      responses:
        '200': {description: Updated workspace role, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceRole'}}}}
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/workspaces/{workspaceKey}/roles/{roleId}/status:
    post:
      summary: Transition a workspace business role status
      operationId: transitionWorkspaceRoleStatus
      tags: [WorkspaceRole]
      security: [{platformSessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/GroupWorkspacePathKey'}
        - {$ref: '#/components/parameters/RolePathId'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceRoleStatusTransitionRequest'}}}}
      responses:
        '200': {description: Updated workspace role status, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceRole'}}}}
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/workspaces/{workspaceKey}/accounts:
    get:
      summary: List workspace user accounts
      operationId: getWorkspaceAccounts
      tags: [WorkspaceAccount]
      security: [{platformSessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/GroupWorkspacePathKey'}
        - {name: userName, in: query, required: false, schema: {type: string, maxLength: 120}}
        - {name: mobile, in: query, required: false, schema: {type: string, maxLength: 32}}
        - {name: loginName, in: query, required: false, schema: {type: string, maxLength: 120}}
        - {name: roleQuery, in: query, required: false, schema: {type: string, maxLength: 120}}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/WorkspaceAccountStatus'}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Workspace account owner readback, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceAccountPage'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/workspaces/{workspaceKey}/accounts/{accountId}:
    get:
      summary: Read one workspace user account
      operationId: getWorkspaceAccount
      tags: [WorkspaceAccount]
      security: [{platformSessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/GroupWorkspacePathKey'}, {name: accountId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}]
      responses:
        '200': {description: Workspace account detail owner readback, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceAccount'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/workspaces/{workspaceKey}/accounts/{accountId}/status:
    post:
      summary: Transition a workspace user account status
      operationId: transitionWorkspaceAccountStatus
      tags: [WorkspaceAccount]
      security: [{platformSessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/GroupWorkspacePathKey'}, {name: accountId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceAccountStatusTransitionRequest'}}}}
      responses:
        '200': {description: Updated workspace account owner readback, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceAccount'}}}}
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/workspaces/{workspaceKey}/accounts/{accountId}/credential-reset:
    post:
      summary: Request a workspace user credential reset
      operationId: requestWorkspaceCredentialReset
      tags: [WorkspaceAccount]
      security: [{platformSessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/GroupWorkspacePathKey'}, {name: accountId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceCredentialResetRequest'}}}}
      responses:
        '200': {description: Credential reset generation owner readback, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceCredentialResetResult'}}}}
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
        '404': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
        '503': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/workspaces/{workspaceKey}/invitations:
    get:
      summary: List workspace invitations
      operationId: getWorkspaceInvitations
      tags: [WorkspaceInvitation]
      security: [{platformSessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/GroupWorkspacePathKey'}
        - {name: mobile, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 32}}
        - {name: organizationQuery, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 240}}
        - {name: roleQuery, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 120}}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/WorkspaceInvitationStatus'}}
        - {name: expiresFrom, in: query, required: false, schema: {type: integer, format: int64, minimum: 0}}
        - {name: expiresTo, in: query, required: false, schema: {type: integer, format: int64, minimum: 0}}
        - {name: sort, in: query, required: false, schema: {$ref: '#/components/schemas/WorkspaceInvitationSortKey', default: CREATED_AT}}
        - {name: direction, in: query, required: false, schema: {$ref: '#/components/schemas/SortDirection', default: DESC}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Invitation owner readback, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceInvitationPage'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
        '403': {$ref: '#/components/responses/PlatformProblem'}
    post:
      summary: Create a workspace invitation
      operationId: createWorkspaceInvitation
      tags: [WorkspaceInvitation]
      security: [{platformSessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/GroupWorkspacePathKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceInvitationCreateRequest'}}}}
      responses:
        '201': {description: Created invitation readback, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceInvitation'}}}}
        '400': {$ref: '#/components/responses/PlatformProblem'}
        '409': {$ref: '#/components/responses/PlatformProblem'}
  /api/platform/workspaces/{workspaceKey}/invitation-candidates:
    get:
      summary: List invitation organization and role candidates
      operationId: getWorkspaceInvitationCandidates
      tags: [WorkspaceInvitation]
      security: [{platformSessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/GroupWorkspacePathKey'}]
      responses:
        '200': {description: Invitation candidates, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceInvitationCandidatePage'}}}}
        '401': {$ref: '#/components/responses/PlatformProblem'}
