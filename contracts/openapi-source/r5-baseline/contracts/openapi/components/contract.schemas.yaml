openapi: 3.0.3
info: {title: Light contract components, version: 0.1.0}
paths: {}
components:
  schemas:
    StoreContractSource:
      type: string
      enum: [MANUAL]
    StoreContractStatus:
      type: string
      enum: [VALID, INVALID]
    StoreContractSortKey:
      type: string
      enum: [CONTRACT_NO, START_DATE, UPDATED_AT]
    StoreContractSortDirection:
      type: string
      enum: [ASC, DESC]
    StoreContractReference:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        code: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 120}
    StoreContractStoreCandidate:
      type: object
      additionalProperties: false
      required: [store, tenant]
      properties:
        store: {$ref: '#/components/schemas/StoreContractReference'}
        tenant: {$ref: '#/components/schemas/StoreContractReference'}
    StoreContractCandidatePage:
      type: object
      additionalProperties: false
      required: [workspaceKey, project, metadata, stores, phases]
      properties:
        workspaceKey: {type: string, minLength: 1, maxLength: 64}
        project: {$ref: '#/components/schemas/StoreContractReference'}
        metadata: {$ref: '#/components/schemas/StoreContractCandidatePageMetadata'}
        stores:
          type: array
          items: {$ref: '#/components/schemas/StoreContractStoreCandidate'}
        phases:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 120}
    StoreContractCandidatePageMetadata:
      type: object
      additionalProperties: false
      required: [storeSearch, page, pageSize, total]
      properties:
        storeSearch: {type: string, nullable: true, maxLength: 120}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
    StoreContract:
      type: object
      additionalProperties: false
      required: [id, workspaceKey, project, store, tenant, phaseName, contractNo, startDate, endDate, itemCodes, extensionValues, extensionRuleRevision, status, revision, source, createdAt, updatedAt]
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        workspaceKey: {type: string, minLength: 1, maxLength: 64}
        project: {$ref: '#/components/schemas/StoreContractReference'}
        store: {$ref: '#/components/schemas/StoreContractReference'}
        tenant: {$ref: '#/components/schemas/StoreContractReference'}
        phaseName: {type: string, minLength: 1, maxLength: 120}
        contractNo: {type: string, minLength: 1, maxLength: 120}
        startDate: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        endDate: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        itemCodes: {type: array, minItems: 1, items: {type: string, minLength: 1, maxLength: 120}}
        note: {type: string, nullable: true, maxLength: 2000}
        extensionValues: {type: object, additionalProperties: true}
        extensionRuleRevision: {type: integer, format: int64, minimum: 0}
        status: {$ref: '#/components/schemas/StoreContractStatus'}
        revision: {type: integer, format: int64, minimum: 0}
        source: {$ref: '#/components/schemas/StoreContractSource'}
        createdAt: {type: integer, format: int64, minimum: 0}
        updatedAt: {type: integer, format: int64, minimum: 0}
    StoreContractPageMetadata:
      type: object
      additionalProperties: false
      required: [workspaceKey, projectRef, projectName, page, pageSize, total, sort, direction]
      properties:
        workspaceKey: {type: string, minLength: 1, maxLength: 64}
        projectRef: {type: string, minLength: 1, maxLength: 64}
        projectName: {type: string, minLength: 1, maxLength: 120}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
        sort: {$ref: '#/components/schemas/StoreContractSortKey'}
        direction: {$ref: '#/components/schemas/StoreContractSortDirection'}
    StoreContractPage:
      type: object
      additionalProperties: false
      required: [metadata, items]
      properties:
        metadata: {$ref: '#/components/schemas/StoreContractPageMetadata'}
        items: {type: array, items: {$ref: '#/components/schemas/StoreContract'}}
    ContractOverviewResolutionStatus:
      type: string
      enum: [RESOLVED, UNRESOLVED]
    ContractOverviewSourceStatus:
      type: string
      enum: [AVAILABLE, UNAVAILABLE]
    ContractOverviewFilterOption:
      type: object
      additionalProperties: false
      required: [kind, id, name]
      properties:
        kind: {type: string, enum: [STORE, TENANT]}
        id: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 120}
    ContractOverviewReference:
      type: object
      additionalProperties: false
      required: [id, code, name, resolutionStatus]
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        code: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 120}
        resolutionStatus: {$ref: '#/components/schemas/ContractOverviewResolutionStatus'}
    ContractOverviewItem:
      type: object
      additionalProperties: false
      required: [contractRef, storeRef, phaseName, tenantRef, itemCodes, status, source, revision, createdAt, updatedAt, storeResolutionStatus, tenantResolutionStatus]
      properties:
        contractRef: {$ref: '#/components/schemas/ContractOverviewReference'}
        storeRef: {$ref: '#/components/schemas/ContractOverviewReference'}
        phaseName: {type: string, minLength: 1, maxLength: 120}
        tenantRef: {$ref: '#/components/schemas/ContractOverviewReference'}
        startDate: {type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$'}
        endDate: {type: string, pattern: '^\\d{4}-\\d{2}-\\d{2}$'}
        itemCodes: {type: array, minItems: 1, items: {type: string, minLength: 1, maxLength: 120}}
        note: {type: string, nullable: true, maxLength: 2000}
        status: {$ref: '#/components/schemas/StoreContractStatus'}
        source: {$ref: '#/components/schemas/StoreContractSource'}
        revision: {type: integer, format: int64, minimum: 0}
        createdAt: {type: integer, format: int64, minimum: 0}
        updatedAt: {type: integer, format: int64, minimum: 0}
        storeResolutionStatus: {$ref: '#/components/schemas/ContractOverviewResolutionStatus'}
        tenantResolutionStatus: {$ref: '#/components/schemas/ContractOverviewResolutionStatus'}
    ContractOverviewPageMetadata:
      type: object
      additionalProperties: false
      required: [workspaceKey, page, pageSize, total, sort, direction]
      properties:
        workspaceKey: {type: string, minLength: 1, maxLength: 64}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
        sort: {$ref: '#/components/schemas/StoreContractSortKey'}
        direction: {$ref: '#/components/schemas/StoreContractSortDirection'}
    ContractOverviewPage:
      type: object
      additionalProperties: false
      required: [metadata, items, itemsSourceStatus, itemsAsOf, itemsUnresolved, filterOptions, filterOptionsSourceStatus, filterOptionsAsOf, filterOptionsUnresolved]
      properties:
        metadata: {$ref: '#/components/schemas/ContractOverviewPageMetadata'}
        items: {type: array, items: {$ref: '#/components/schemas/ContractOverviewItem'}}
        itemsSourceStatus: {$ref: '#/components/schemas/ContractOverviewSourceStatus'}
        itemsAsOf: {type: integer, format: int64, minimum: 0, nullable: true}
        itemsUnresolved:
          type: array
          items: {type: string, maxLength: 160}
          maxItems: 16
        filterOptions:
          type: array
          items: {$ref: '#/components/schemas/ContractOverviewFilterOption'}
          maxItems: 500
        filterOptionsSourceStatus: {$ref: '#/components/schemas/ContractOverviewSourceStatus'}
        filterOptionsAsOf: {type: integer, format: int64, minimum: 0, nullable: true}
        filterOptionsUnresolved:
          type: array
          items: {type: string, maxLength: 160}
          maxItems: 16
    StoreContractCreateRequest:
      type: object
      additionalProperties: false
      required: [projectId, storeId, phaseName, contractNo, startDate, endDate, itemCodes, expectedContextVersion]
      properties:
        projectId: {type: string, minLength: 1, maxLength: 64}
        storeId: {type: string, minLength: 1, maxLength: 64}
        phaseName: {type: string, minLength: 1, maxLength: 120}
        contractNo: {type: string, minLength: 1, maxLength: 120}
        startDate: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        endDate: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        itemCodes: {type: array, minItems: 1, items: {type: string, minLength: 1, maxLength: 120}}
        note: {type: string, nullable: true, maxLength: 2000}
        extensionValues: {type: object, nullable: true, additionalProperties: true}
        expectedExtensionRuleRevision: {type: integer, format: int64, nullable: true, minimum: 0}
        expectedContextVersion: {type: integer, format: int64, minimum: 0}
    StoreContractUpdateRequest:
      type: object
      additionalProperties: false
      required: [phaseName, startDate, endDate, itemCodes, expectedRevision, expectedContextVersion]
      properties:
        phaseName: {type: string, minLength: 1, maxLength: 120}
        startDate: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        endDate: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        itemCodes: {type: array, minItems: 1, items: {type: string, minLength: 1, maxLength: 120}}
        note: {type: string, nullable: true, maxLength: 2000}
        extensionValues: {type: object, nullable: true, additionalProperties: true}
        expectedExtensionRuleRevision: {type: integer, format: int64, nullable: true, minimum: 0}
        expectedRevision: {type: integer, format: int64, minimum: 0}
        expectedContextVersion: {type: integer, format: int64, minimum: 0}
    StoreContractInvalidateRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, expectedContextVersion]
      properties:
        expectedRevision: {type: integer, format: int64, minimum: 0}
        expectedContextVersion: {type: integer, format: int64, minimum: 0}
