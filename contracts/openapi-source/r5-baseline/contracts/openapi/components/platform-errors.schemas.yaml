openapi: 3.0.3
info:
  title: Platform Error Components
  version: 0.1.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths: {}
components:
  schemas:
    PlatformErrorCode:
      type: string
      enum:
        - PLATFORM_INVALID_CREDENTIALS
        - PLATFORM_INTERNAL_UNAUTHORIZED
        - PLATFORM_REQUEST_VALIDATION_FAILED
        - PLATFORM_ACCESS_DENIED
        - PLATFORM_ADMIN_DISABLED
        - PLATFORM_SESSION_EXPIRED
        - PLATFORM_DEPENDENCY_UNAVAILABLE
        - PLATFORM_DOWNSTREAM_PROTOCOL_MISMATCH
        - PLATFORM_WORKSPACE_KEY_CONFLICT
        - PLATFORM_WORKSPACE_NAME_CONFLICT
        - PLATFORM_VERSION_CONFLICT
        - PLATFORM_ASSET_BIND_CONFLICT
        - PLATFORM_IDEMPOTENCY_CONFLICT
        - PLATFORM_WORKSPACE_STATUS_TRANSITION_INVALID
        - LOGIN_NAME_CONFLICT
        - PLATFORM_RESOURCE_NOT_FOUND
        - PLATFORM_LOGIN_RATE_LIMITED
        - WORKSPACE_DISABLED
        - WORKSPACE_USER_DISABLED
        - COMMERCIAL_GROUP_ALREADY_INITIALIZED
        - COMMERCIAL_GROUP_ROOT_NOT_INITIALIZED
        - WORKSPACE_ROLE_NAME_CONFLICT
        - WORKSPACE_ROLE_ORGANIZATION_TYPE_UNSUPPORTED
        - WORKSPACE_ROLE_CAPABILITY_UNKNOWN
        - WORKSPACE_ROLE_CAPABILITY_CATALOG_DRIFT
        - WORKSPACE_ROLE_CAPABILITY_INCOMPATIBLE
        - WORKSPACE_ROLE_REVISION_CONFLICT
        - WORKSPACE_ROLE_STATUS_TRANSITION_INVALID
        - ORGANIZATION_NODE_CODE_CONFLICT
        - ORGANIZATION_NODE_NAME_CONFLICT
        - ORGANIZATION_NODE_PARENT_INVALID
        - ORGANIZATION_NODE_REVISION_CONFLICT
        - ORGANIZATION_NODE_STATUS_TRANSITION_INVALID
        - COMMERCIAL_GROUP_REQUIRED
        - WORKSPACE_PAGE_ACCESS_CATALOG_MISMATCH
        - WORKSPACE_INVITATION_DUPLICATE
        - WORKSPACE_INVITATION_REVISION_CONFLICT
        - WORKSPACE_INVITATION_NOT_ACTIVE
        - WORKSPACE_ACCOUNT_REVISION_CONFLICT
        - WORKSPACE_ACCOUNT_STATUS_TRANSITION_INVALID
        - WORKSPACE_CREDENTIAL_RESET_UNAVAILABLE
        - WORKSPACE_PASSWORD_RESET_GENERATION_INVALID
        - WORKSPACE_PASSWORD_RESET_MOBILE_MISMATCH
        - WORKSPACE_PASSWORD_RESET_OTP_INVALID
        - WORKSPACE_PASSWORD_RESET_GRANT_INVALID
        - WORKSPACE_PASSWORD_RESET_REPLAYED
        - WORKSPACE_PASSWORD_POLICY_INVALID
        - WORKSPACE_MEMBERSHIP_PAGE_NOT_GRANTED
        - WORKSPACE_MEMBERSHIP_SCOPE_REQUIRED
        - WORKSPACE_MEMBERSHIP_SCOPE_FORBIDDEN
        - WORKSPACE_MEMBERSHIP_TARGET_INVALID
        - WORKSPACE_MEMBERSHIP_ASSIGNMENT_REVISION_CONFLICT
        - WORKSPACE_MEMBERSHIP_ASSIGNMENT_NOT_ACTIVE
        - EXTENSION_DEFINITION_REVISION_CONFLICT
        - EXTENSION_DEFINITION_INVALID
        - BUSINESS_ENTITY_CODE_CONFLICT
        - BUSINESS_ENTITY_NAME_CONFLICT
        - BUSINESS_ENTITY_REFERENCE_CONFLICT
        - BUSINESS_ENTITY_REVISION_CONFLICT
        - BUSINESS_ENTITY_STATUS_TRANSITION_INVALID
        - BUSINESS_ENTITY_SOURCE_READ_ONLY
        - HEAD_COMPANY_BRAND_AUTHORIZATION_REQUIRED
        - HEAD_COMPANY_BRAND_AUTHORIZATION_IN_USE
        - HEAD_COMPANY_BRAND_AUTHORIZATION_REVISION_CONFLICT
        - BUSINESS_ENTITY_UNRESOLVED_REFERENCE
        - ORGANIZATION_STORE_CODE_CONFLICT
        - ORGANIZATION_STORE_NAME_CONFLICT
        - ORGANIZATION_STORE_PROJECT_REQUIRED
        - ORGANIZATION_STORE_RELATION_INVALID
        - ORGANIZATION_STORE_RELATION_LOCKED
        - ORGANIZATION_STORE_REVISION_CONFLICT
        - ORGANIZATION_STORE_STATUS_TRANSITION_INVALID
        - ORGANIZATION_STORE_HEAD_COMPANY_AUTHORIZATION_REQUIRED
        - ORGANIZATION_STORE_FIXED_SCOPE_FORBIDDEN
        - ORGANIZATION_STORE_EXTENSION_REVISION_CONFLICT
        - CONTRACT_REFERENCE_UNRESOLVED
        - CONTRACT_PROJECT_PHASE_NOT_AVAILABLE
        - CONTRACT_NUMBER_CONFLICT
        - CONTRACT_ITEM_CODE_REQUIRED
        - CONTRACT_ITEM_CODE_DUPLICATE
        - CONTRACT_DATE_RANGE_INVALID
        - CONTRACT_ALREADY_INVALID
        - CONTRACT_REVISION_CONFLICT
    PlatformProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, errorCode, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 1024
        instance:
          type: string
          format: uri-reference
        errorCode:
          $ref: '#/components/schemas/PlatformErrorCode'
        correlationId:
          type: string
          minLength: 8
          maxLength: 128
        retryAfterSeconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 3600
          description: Present only when the caller can safely wait before retrying.
