openapi: 3.0.3
info:
  title: Commercial Group Wire Components
  version: 0.1.0
paths: {}
components:
  schemas:
    CommercialGroupRoot:
      type: object
      additionalProperties: false
      required: [id, workspaceKey, groupCode, groupName, version, createdAt, updatedAt]
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        workspaceKey: {type: string, minLength: 1, maxLength: 64}
        groupCode: {type: string, minLength: 1, maxLength: 64}
        groupName: {type: string, minLength: 1, maxLength: 120}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {$ref: './platform-time.schemas.yaml#/components/schemas/EpochMillis'}
        updatedAt: {$ref: './platform-time.schemas.yaml#/components/schemas/EpochMillis'}
    CommercialGroupRootSummary:
      type: object
      additionalProperties: false
      required: [initialized]
      properties:
        initialized: {type: boolean}
        root:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CommercialGroupRoot'
    CommercialGroupInitializeRequest:
      type: object
      additionalProperties: false
      required: [groupCode, groupName, idempotencyKey]
      properties:
        groupCode: {type: string, minLength: 1, maxLength: 64}
        groupName: {type: string, minLength: 1, maxLength: 120}
        idempotencyKey: {type: string, minLength: 16, maxLength: 128}
    CommercialGroupInitializeCommand:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request:
          $ref: '#/components/schemas/CommercialGroupInitializeRequest'
        envelope:
          $ref: '#/components/schemas/OrganizationCommercialGroupActorEnvelope'
    OrganizationCommercialGroupActorEnvelope:
      type: object
      additionalProperties: false
      required: [actorId, audience, operation, capability, issuedAt, expiresAt, payloadDigest, signature]
      properties:
        actorId: {type: string, format: uuid}
        audience: {type: string, enum: [organization-commercial-group]}
        operation: {type: string, enum: [INITIALIZE_COMMERCIAL_GROUP]}
        capability:
          $ref: './platform-capabilities.schemas.yaml#/components/schemas/PlatformCapability'
        issuedAt:
          $ref: './platform-time.schemas.yaml#/components/schemas/EpochMillis'
        expiresAt:
          $ref: './platform-time.schemas.yaml#/components/schemas/EpochMillis'
        payloadDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        signature: {type: string, pattern: '^[a-f0-9]{64}$'}
