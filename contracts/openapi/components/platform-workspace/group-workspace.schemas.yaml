{
  "components": {
    "schemas": {
      "GroupWorkspaceCreateRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "groupWorkspaceKey",
          "name",
          "operationsTitle",
          "logoAssetRef",
          "logoBindGrant",
          "idempotencyKey"
        ],
        "properties": {
          "groupWorkspaceKey": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9-]{0,63}$"
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "operationsTitle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "logoAssetRef": {
            "type": "string",
            "minLength": 32,
            "maxLength": 128
          },
          "logoBindGrant": {
            "type": "string",
            "minLength": 32,
            "maxLength": 256,
            "description": "One-time opaque staging proof. It is consumed during the workspace command and is never returned or persisted by a workspace owner."
          },
          "notes": {
            "type": "string",
            "maxLength": 500
          },
          "idempotencyKey": {
            "type": "string",
            "minLength": 16,
            "maxLength": 128
          }
        }
      },
      "GroupWorkspaceCreateResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "groupWorkspaceKey",
          "name",
          "operationsTitle",
          "logoAssetRef",
          "status",
          "version",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "groupWorkspaceKey": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "operationsTitle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "logoAssetRef": {
            "type": "string",
            "minLength": 32,
            "maxLength": 128
          },
          "notes": {
            "type": "string",
            "nullable": true,
            "maxLength": 500
          },
          "status": {
            "$ref": "#/components/schemas/GroupWorkspaceStatus"
          },
          "statusChangedAt": {
            "description": "UTC epoch milliseconds when the current status was established. Null for legacy workspaces without a provable status-history record.",
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "nullable": true
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "createdAt": {
            "$ref": "../common/time.schemas.yaml#/components/schemas/EpochMillis"
          },
          "updatedAt": {
            "$ref": "../common/time.schemas.yaml#/components/schemas/EpochMillis"
          }
        }
      },
      "GroupWorkspaceDetail": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "groupWorkspaceKey",
          "name",
          "operationsTitle",
          "status",
          "version",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "groupWorkspaceKey": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "operationsTitle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "logoAssetRef": {
            "type": "string",
            "nullable": true,
            "maxLength": 128
          },
          "logoUrl": {
            "type": "string",
            "format": "uri",
            "nullable": true,
            "description": "Gateway-approved display URL for the bound Logo asset; clients must not derive it from logoAssetRef."
          },
          "notes": {
            "type": "string",
            "nullable": true,
            "maxLength": 500
          },
          "status": {
            "$ref": "#/components/schemas/GroupWorkspaceStatus"
          },
          "statusChangedAt": {
            "description": "UTC epoch milliseconds when the current status was established. Null for legacy workspaces without a provable status-history record.",
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "nullable": true
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "createdAt": {
            "$ref": "../common/time.schemas.yaml#/components/schemas/EpochMillis"
          },
          "updatedAt": {
            "$ref": "../common/time.schemas.yaml#/components/schemas/EpochMillis"
          },
          "commercialGroup": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "initialized"
            ],
            "properties": {
              "initialized": {
                "type": "boolean"
              },
              "root": {
                "type": "object",
                "nullable": true,
                "allOf": [
                  {
                    "$ref": "../organization/commercial-group.schemas.yaml#/components/schemas/CommercialGroupRoot"
                  }
                ]
              }
            }
          },
          "workspaceSourceStatus": {
            "type": "string",
            "enum": [
              "AVAILABLE",
              "UNAVAILABLE"
            ],
            "description": "Availability of the platform-workspace facts shown in the workspace overview."
          },
          "workspaceAsOf": {
            "$ref": "../common/time.schemas.yaml#/components/schemas/EpochMillis"
          },
          "workspaceUnresolved": {
            "type": "string",
            "nullable": true,
            "maxLength": 160
          },
          "initializationSourceStatus": {
            "type": "string",
            "enum": [
              "AVAILABLE",
              "UNAVAILABLE"
            ],
            "description": "Availability of the organization-owned initialization facts shown in the workspace overview."
          },
          "initializationAsOf": {
            "$ref": "../common/time.schemas.yaml#/components/schemas/EpochMillis"
          },
          "initializationUnresolved": {
            "type": "string",
            "nullable": true,
            "maxLength": 160
          },
          "accountAccessSourceStatus": {
            "type": "string",
            "enum": [
              "AVAILABLE",
              "UNAVAILABLE"
            ],
            "description": "Availability of the workspace IAM account and role counts shown in the workspace overview."
          },
          "accountAccessAsOf": {
            "$ref": "../common/time.schemas.yaml#/components/schemas/EpochMillis"
          },
          "accountAccessUnresolved": {
            "type": "string",
            "nullable": true,
            "maxLength": 160
          },
          "accountCount": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "nullable": true
          },
          "roleCount": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "nullable": true
          }
        }
      },
      "GroupWorkspaceDisplayUpdateRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "operationsTitle",
          "logoIntent",
          "expectedVersion",
          "idempotencyKey"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "operationsTitle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "notes": {
            "type": "string",
            "nullable": true,
            "maxLength": 500
          },
          "logoIntent": {
            "type": "string",
            "enum": [
              "KEEP",
              "REPLACE",
              "REMOVE"
            ],
            "description": "KEEP and REMOVE require logoAssetRef and logoBindGrant to be absent. REPLACE requires both values from a live platform-asset staging readback."
          },
          "logoAssetRef": {
            "type": "string",
            "nullable": true,
            "minLength": 32,
            "maxLength": 128
          },
          "logoBindGrant": {
            "type": "string",
            "nullable": true,
            "minLength": 32,
            "maxLength": 256,
            "description": "Required exactly when logoIntent is REPLACE; consumed by the asset owner and never stored by this owner. It must be absent for KEEP and REMOVE."
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "idempotencyKey": {
            "type": "string",
            "minLength": 16,
            "maxLength": 128
          }
        }
      },
      "GroupWorkspacePage": {
        "type": "object",
        "required": [
          "items",
          "page",
          "pageSize",
          "total",
          "sortKey",
          "sortDirection"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "groupWorkspaceKey",
                "name",
                "status",
                "updatedAt"
              ],
              "properties": {
                "groupWorkspaceKey": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 64
                },
                "name": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 120
                },
                "operationsTitle": {
                  "type": "string",
                  "nullable": true,
                  "maxLength": 120
                },
                "logoAssetRef": {
                  "type": "string",
                  "nullable": true,
                  "maxLength": 128
                },
                "logoUrl": {
                  "type": "string",
                  "format": "uri",
                  "nullable": true,
                  "description": "Gateway-approved display URL for the bound Logo asset; clients must not derive it from logoAssetRef."
                },
                "commercialGroup": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "initialized"
                  ],
                  "properties": {
                    "initialized": {
                      "type": "boolean"
                    },
                    "root": {
                      "type": "object",
                      "nullable": true,
                      "allOf": [
                        {
                          "$ref": "../organization/commercial-group.schemas.yaml#/components/schemas/CommercialGroupRoot"
                        }
                      ]
                    }
                  }
                },
                "status": {
                  "$ref": "#/components/schemas/GroupWorkspaceStatus"
                },
                "updatedAt": {
                  "$ref": "../common/time.schemas.yaml#/components/schemas/EpochMillis"
                }
              }
            }
          },
          "page": {
            "type": "integer",
            "minimum": 1
          },
          "pageSize": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "total": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "sortKey": {
            "$ref": "#/components/schemas/GroupWorkspaceSortKey"
          },
          "sortDirection": {
            "$ref": "../common/enum.schemas.yaml#/components/schemas/SortDirection"
          }
        }
      },
      "GroupWorkspaceStatusTransitionRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "targetStatus",
          "expectedVersion",
          "idempotencyKey"
        ],
        "properties": {
          "targetStatus": {
            "$ref": "#/components/schemas/GroupWorkspaceStatus"
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "idempotencyKey": {
            "type": "string",
            "minLength": 16,
            "maxLength": 128
          }
        }
      },
      "GroupWorkspaceSortKey": {
        "type": "string",
        "enum": [
          "NAME",
          "WORKSPACE_KEY",
          "UPDATED_AT"
        ]
      },
      "GroupWorkspaceStatus": {
        "type": "string",
        "enum": [
          "ENABLED",
          "DISABLED"
        ]
      }
    }
  }
}
