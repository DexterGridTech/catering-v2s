{
  "components": {
    "schemas": {
      "WorkspaceCurrentPasswordChangeRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "currentPassword",
          "newPassword",
          "expectedSessionVersion"
        ],
        "properties": {
          "currentPassword": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "writeOnly": true
          },
          "newPassword": {
            "type": "string",
            "minLength": 8,
            "maxLength": 128,
            "writeOnly": true
          },
          "expectedSessionVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      },
      "WorkspaceCurrentPasswordChangeResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "sessionsRevoked",
          "reauthenticationRequired"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "COMPLETED"
            ]
          },
          "sessionsRevoked": {
            "type": "boolean"
          },
          "reauthenticationRequired": {
            "type": "boolean"
          }
        }
      },
      "WorkspaceLoginEntry": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "groupWorkspaceKey",
          "workspaceName",
          "operationsTitle",
          "status",
          "sessionState"
        ],
        "properties": {
          "groupWorkspaceKey": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "workspaceName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "operationsTitle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "logoUrl": {
            "type": "string",
            "nullable": true,
            "maxLength": 2048,
            "format": "uri"
          },
          "status": {
            "$ref": "../platform-workspace/group-workspace.schemas.yaml#/components/schemas/GroupWorkspaceStatus"
          },
          "sessionState": {
            "type": "string",
            "enum": [
              "NONE",
              "AUTHENTICATED"
            ]
          }
        }
      },
      "WorkspacePasswordLoginRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "loginName",
          "password"
        ],
        "properties": {
          "loginName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          }
        }
      },
      "WorkspaceSelectContextRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "roleAssignmentRef",
          "requiredContextVersion"
        ],
        "properties": {
          "roleAssignmentRef": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "requiredContextVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "semantics": "the currently observed session context version required for this selection command"
          }
        }
      },
      "WorkspaceSelectDataNodeRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "dataNodeRef",
          "dataNodeType",
          "requiredContextVersion"
        ],
        "properties": {
          "dataNodeRef": {
            "type": "string",
            "minLength": 1,
            "maxLength": 240
          },
          "dataNodeType": {
            "$ref": "../common/enum.schemas.yaml#/components/schemas/ServiceNodeType"
          },
          "requiredContextVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "semantics": "the currently observed session context version required for this data-node selection command"
          }
        }
      },
      "WorkspaceSessionEntry": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "groupWorkspaceKey",
          "accountId",
          "displayName",
          "workspaceName",
          "operationsTitle",
          "contextVersion",
          "mode",
          "outcome",
          "candidates",
          "actionGrants"
        ],
        "properties": {
          "groupWorkspaceKey": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "accountId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "displayName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "workspaceName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "operationsTitle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "logoUrl": {
            "type": "string",
            "nullable": true,
            "maxLength": 2048,
            "format": "uri"
          },
          "contextVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "mode": {
            "type": "string",
            "enum": [
              "DIRECT",
              "SELECT",
              "EMPTY"
            ]
          },
          "outcome": {
            "type": "string",
            "description": "Owner-confirmed authenticated-entry outcome. Consumers must branch only on this value and must not infer a role home or scope transition.",
            "enum": [
              "HOME",
              "SELECT_IDENTITY",
              "SELECT_SCOPE",
              "EMPTY_WORKBENCH"
            ]
          },
          "candidates": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "roleAssignmentRef",
                "roleId",
                "roleName",
                "roleNodeRef",
                "roleNodeType",
                "roleNodeName",
                "homePageDesignKey",
                "pageDesignKeys",
                "navigation"
              ],
              "properties": {
                "roleAssignmentRef": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 64,
                  "description": "Stable current operations-role assignment reference; never infer it from roleId."
                },
                "roleId": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 64
                },
                "roleName": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 120
                },
                "roleNodeRef": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 240
                },
                "roleNodeType": {
                  "$ref": "../common/enum.schemas.yaml#/components/schemas/ServiceNodeType"
                },
                "roleNodeName": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 240
                },
                "homePageDesignKey": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 120
                },
                "pageDesignKeys": {
                  "type": "array",
                  "items": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 80
                  }
                },
                "navigation": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "pageDesignKey",
                      "title",
                      "menuGroup",
                      "menuOrder",
                      "kind",
                      "pageAccessManaged",
                      "requiredDataNodeType"
                    ],
                    "properties": {
                      "pageDesignKey": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 80
                      },
                      "title": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 120
                      },
                      "menuGroup": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 120
                      },
                      "menuOrder": {
                        "type": "integer",
                        "format": "int32",
                        "minimum": 0
                      },
                      "kind": {
                        "type": "string",
                        "enum": [
                          "ROLE_HOME",
                          "BUSINESS"
                        ]
                      },
                      "pageAccessManaged": {
                        "type": "boolean"
                      },
                      "requiredDataNodeType": {
                        "type": "string",
                        "enum": [
                          "NONE",
                          "REGION",
                          "PROJECT",
                          "STORE"
                        ]
                      }
                    }
                  }
                }
              }
            }
          },
          "actionGrants": {
            "type": "array",
            "description": "Owner-confirmed action grants for the selected operations role assignment and contextVersion. They control action-surface presentation only; command owners re-authorize against current facts.",
            "items": {
              "type": "string",
              "enum": [
                "BC-ORG-GROUP-EDIT",
                "BC-ORG-GROUP-STATUS",
                "BC-ORG-REGION-CREATE",
                "BC-ORG-REGION-EDIT",
                "BC-ORG-REGION-STATUS",
                "BC-ORG-PROJECT-CREATE",
                "BC-ORG-PROJECT-EDIT",
                "BC-ORG-PROJECT-STATUS",
                "BC-ORG-BRAND-CREATE",
                "BC-ORG-BRAND-EDIT",
                "BC-ORG-BRAND-STATUS",
                "BC-ORG-TENANT-CREATE",
                "BC-ORG-TENANT-EDIT",
                "BC-ORG-TENANT-STATUS",
                "BC-ORG-HEAD-COMPANY-CREATE",
                "BC-ORG-HEAD-COMPANY-EDIT",
                "BC-ORG-HEAD-COMPANY-STATUS",
                "BC-ORG-HEAD-COMPANY-BRAND",
                "BC-ORG-STORE-CREATE",
                "BC-ORG-STORE-EDIT",
                "BC-ORG-STORE-STATUS",
                "BC-IAM-GROUP-ROLE-REVOKE",
                "BC-IAM-REGION-ROLE-REVOKE",
                "BC-IAM-PROJECT-ROLE-REVOKE",
                "BC-IAM-HEAD-COMPANY-ROLE-REVOKE",
                "BC-IAM-STORE-ROLE-REVOKE",
                "BC-IAM-GROUP-INVITE",
                "BC-IAM-REGION-INVITE",
                "BC-IAM-PROJECT-INVITE",
                "BC-IAM-HEAD-COMPANY-INVITE",
                "BC-IAM-STORE-INVITE",
                "BC-CONTRACT-CREATE",
                "BC-CONTRACT-EDIT",
                "BC-CONTRACT-INVALIDATE"
              ]
            }
          },
          "dataNodeCandidates": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "dataNodeType",
                "dataNodeRef",
                "dataNodeName",
                "ancestorPath"
              ],
              "properties": {
                "dataNodeType": {
                  "$ref": "../common/enum.schemas.yaml#/components/schemas/ServiceNodeType"
                },
                "dataNodeRef": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 240
                },
                "dataNodeName": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 240
                },
                "ancestorPath": {
                  "type": "array",
                  "minItems": 1,
                  "items": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 240
                  }
                },
                "regionRef": {
                  "type": "string",
                  "nullable": true,
                  "maxLength": 64
                },
                "projectRef": {
                  "type": "string",
                  "nullable": true,
                  "maxLength": 64
                },
                "storeRef": {
                  "type": "string",
                  "nullable": true,
                  "maxLength": 64
                }
              }
            }
          },
          "selected": {
            "type": "object",
            "nullable": true,
            "allOf": [
              {
                "allOf": [
                  {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "roleAssignmentRef",
                      "roleId",
                      "roleName",
                      "roleNodeRef",
                      "roleNodeType",
                      "roleNodeName",
                      "homePageDesignKey",
                      "pageDesignKeys",
                      "navigation"
                    ],
                    "properties": {
                      "roleAssignmentRef": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 64,
                        "description": "Stable current operations-role assignment reference; never infer it from roleId."
                      },
                      "roleId": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 64
                      },
                      "roleName": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 120
                      },
                      "roleNodeRef": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 240
                      },
                      "roleNodeType": {
                        "$ref": "../common/enum.schemas.yaml#/components/schemas/ServiceNodeType"
                      },
                      "roleNodeName": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 240
                      },
                      "homePageDesignKey": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 120
                      },
                      "pageDesignKeys": {
                        "type": "array",
                        "items": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 80
                        }
                      },
                      "navigation": {
                        "type": "array",
                        "items": {
                          "type": "object",
                          "additionalProperties": false,
                          "required": [
                            "pageDesignKey",
                            "title",
                            "menuGroup",
                            "menuOrder",
                            "kind",
                            "pageAccessManaged",
                            "requiredDataNodeType"
                          ],
                          "properties": {
                            "pageDesignKey": {
                              "type": "string",
                              "minLength": 1,
                              "maxLength": 80
                            },
                            "title": {
                              "type": "string",
                              "minLength": 1,
                              "maxLength": 120
                            },
                            "menuGroup": {
                              "type": "string",
                              "minLength": 1,
                              "maxLength": 120
                            },
                            "menuOrder": {
                              "type": "integer",
                              "format": "int32",
                              "minimum": 0
                            },
                            "kind": {
                              "type": "string",
                              "enum": [
                                "ROLE_HOME",
                                "BUSINESS"
                              ]
                            },
                            "pageAccessManaged": {
                              "type": "boolean"
                            },
                            "requiredDataNodeType": {
                              "type": "string",
                              "enum": [
                                "NONE",
                                "REGION",
                                "PROJECT",
                                "STORE"
                              ]
                            }
                          }
                        }
                      }
                    }
                  },
                  {
                    "type": "object",
                    "required": [
                      "contextVersion"
                    ],
                    "properties": {
                      "contextVersion": {
                        "type": "integer",
                        "format": "int64",
                        "minimum": 0
                      }
                    }
                  }
                ]
              }
            ]
          },
          "selectedDataNode": {
            "allOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "dataNodeType",
                  "dataNodeRef",
                  "dataNodeName",
                  "ancestorPath"
                ],
                "properties": {
                  "dataNodeType": {
                    "$ref": "../common/enum.schemas.yaml#/components/schemas/ServiceNodeType"
                  },
                  "dataNodeRef": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 240
                  },
                  "dataNodeName": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 240
                  },
                  "ancestorPath": {
                    "type": "array",
                    "minItems": 1,
                    "items": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 240
                    }
                  },
                  "regionRef": {
                    "type": "string",
                    "nullable": true,
                    "maxLength": 64
                  },
                  "projectRef": {
                    "type": "string",
                    "nullable": true,
                    "maxLength": 64
                  },
                  "storeRef": {
                    "type": "string",
                    "nullable": true,
                    "maxLength": 64
                  }
                }
              },
              {
                "type": "object",
                "required": [
                  "contextVersion"
                ],
                "properties": {
                  "contextVersion": {
                    "type": "integer",
                    "format": "int64",
                    "minimum": 0
                  }
                }
              }
            ]
          }
        }
      }
    }
  }
}
