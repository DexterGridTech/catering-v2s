{
  "components": {
    "schemas": {
      "PlatformAssetStagingResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "assetRef",
          "bindGrant",
          "expiresAt",
          "contentType",
          "sizeBytes",
          "sha256"
        ],
        "properties": {
          "assetRef": {
            "type": "string",
            "minLength": 32,
            "maxLength": 128
          },
          "bindGrant": {
            "type": "string",
            "minLength": 32,
            "maxLength": 256
          },
          "expiresAt": {
            "$ref": "../common/time.schemas.yaml#/components/schemas/EpochMillis"
          },
          "contentType": {
            "type": "string",
            "enum": [
              "image/png",
              "image/jpeg",
              "image/webp"
            ]
          },
          "sizeBytes": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 5242880
          },
          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        }
      },
      "PlatformAssetUsage": {
        "type": "string",
        "enum": [
          "GROUP_WORKSPACE_LOGO"
        ]
      },
      "PlatformAssetStageMultipart": {
        "type": "object",
        "required": [
          "usage",
          "file"
        ],
        "properties": {
          "usage": {
            "type": "string",
            "enum": [
              "GROUP_WORKSPACE_LOGO"
            ]
          },
          "groupWorkspaceKey": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          },
          "file": {
            "type": "string",
            "format": "binary"
          }
        },
        "additionalProperties": false
      },
      "BinaryAssetContent": {
        "type": "string",
        "format": "binary"
      },
      "PublicAssetReference": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "publicUrl",
          "contentType",
          "sha256"
        ],
        "properties": {
          "publicUrl": {
            "type": "string",
            "format": "uri",
            "minLength": 1
          },
          "contentType": {
            "type": "string",
            "enum": [
              "image/png",
              "image/jpeg",
              "image/webp",
              "video/mp4"
            ]
          },
          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        }
      }
    }
  }
}
