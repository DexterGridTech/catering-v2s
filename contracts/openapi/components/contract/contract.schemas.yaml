{
  "components": {
    "schemas": {
      "ContractOverviewItem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "contractRef",
          "storeRef",
          "phaseName",
          "tenantRef",
          "status",
          "source",
          "revision",
          "createdAt",
          "updatedAt",
          "storeResolutionStatus",
          "tenantResolutionStatus"
        ],
        "properties": {
          "contractRef": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "id",
              "code",
              "name",
              "resolutionStatus"
            ],
            "properties": {
              "id": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64
              },
              "code": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64
              },
              "name": {
                "type": "string",
                "minLength": 1,
                "maxLength": 120
              },
              "resolutionStatus": {
                "type": "string",
                "enum": [
                  "RESOLVED",
                  "UNRESOLVED"
                ]
              }
            }
          },
          "storeRef": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "id",
              "code",
              "name",
              "resolutionStatus"
            ],
            "properties": {
              "id": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64
              },
              "code": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64
              },
              "name": {
                "type": "string",
                "minLength": 1,
                "maxLength": 120
              },
              "resolutionStatus": {
                "type": "string",
                "enum": [
                  "RESOLVED",
                  "UNRESOLVED"
                ]
              }
            }
          },
          "phaseName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "tenantRef": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "id",
              "code",
              "name",
              "resolutionStatus"
            ],
            "properties": {
              "id": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64
              },
              "code": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64
              },
              "name": {
                "type": "string",
                "minLength": 1,
                "maxLength": 120
              },
              "resolutionStatus": {
                "type": "string",
                "enum": [
                  "RESOLVED",
                  "UNRESOLVED"
                ]
              }
            }
          },
          "effectiveFrom": {
            "type": "string",
            "pattern": "^\\\\d{4}-\\\\d{2}-\\\\d{2}$"
          },
          "effectiveTo": {
            "type": "string",
            "pattern": "^\\\\d{4}-\\\\d{2}-\\\\d{2}$"
          },
          "note": {
            "type": "string",
            "nullable": true,
            "maxLength": 2000
          },
          "itemSummary": {
            "type": "string",
            "maxLength": 2000
          },
          "status": {
            "$ref": "#/components/schemas/StoreContractStatus"
          },
          "source": {
            "type": "string",
            "enum": [
              "MANUAL"
            ]
          },
          "revision": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "createdAt": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "updatedAt": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "storeResolutionStatus": {
            "type": "string",
            "enum": [
              "RESOLVED",
              "UNRESOLVED"
            ]
          },
          "tenantResolutionStatus": {
            "type": "string",
            "enum": [
              "RESOLVED",
              "UNRESOLVED"
            ]
          },
          "extensionFields": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": ["name"],
              "properties": {
                "name": {"type": "string", "minLength": 1, "maxLength": 120},
                "value": {"type": "string", "nullable": true, "maxLength": 2000}
              }
            },
            "maxItems": 100
          }
        }
      },
      "ContractOverviewPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "metadata",
          "items",
          "itemsSourceStatus",
          "itemsAsOf",
          "itemsUnresolved",
          "filterOptions",
          "filterOptionsSourceStatus",
          "filterOptionsAsOf",
          "filterOptionsUnresolved"
        ],
        "properties": {
          "metadata": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "groupWorkspaceKey",
              "page",
              "pageSize",
              "total",
              "sort",
              "direction"
            ],
            "properties": {
              "groupWorkspaceKey": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64
              },
              "page": {
                "type": "integer",
                "minimum": 1
              },
              "pageSize": {
                "type": "integer",
                "minimum": 1,
                "maximum": 100
              },
              "total": {
                "type": "integer",
                "format": "int64",
                "minimum": 0
              },
              "sort": {
                "$ref": "#/components/schemas/StoreContractSortKey"
              },
              "direction": {
                "$ref": "#/components/schemas/StoreContractSortDirection"
              }
            }
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ContractOverviewItem"
            }
          },
          "itemsSourceStatus": {
            "type": "string",
            "enum": [
              "AVAILABLE",
              "UNAVAILABLE"
            ]
          },
          "itemsAsOf": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "nullable": true
          },
          "itemsUnresolved": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 160
            },
            "maxItems": 16
          },
          "filterOptions": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "kind",
                "id",
                "name"
              ],
              "properties": {
                "kind": {
                  "type": "string",
                  "enum": [
                    "STORE",
                    "TENANT"
                  ]
                },
                "id": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 64
                },
                "name": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 120
                }
              }
            },
            "maxItems": 500
          },
          "filterOptionsSourceStatus": {
            "type": "string",
            "enum": [
              "AVAILABLE",
              "UNAVAILABLE"
            ]
          },
          "filterOptionsAsOf": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "nullable": true
          },
          "filterOptionsUnresolved": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 160
            },
            "maxItems": 16
          }
        }
      },
