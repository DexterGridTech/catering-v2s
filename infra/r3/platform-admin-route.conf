location /platform-admin/ {
    auth_request /_external_auth;
    auth_request_set $trusted_edge_auth $upstream_http_x_edge_auth;
    proxy_pass http://platform-admin:8080/;
    proxy_set_header X-Edge-Auth $trusted_edge_auth;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Client-Edge-Auth "";
}
