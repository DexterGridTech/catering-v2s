<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>门店销售菜单 · 单页 IA</title>
  <style>
    :root { --blue:#2457c5; --blue-weak:#eef4ff; --text:#24344d; --muted:#77859a; --line:#dfe6ef; --bg:#f4f7fb; --green:#2f8f4e; --red:#d34848; --orange:#c87514; --shadow:0 14px 38px rgba(35,58,93,.16); }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); background:var(--bg); }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.42; }
    .shell { min-height:100vh; }
    .appbar { height:56px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
    .brand { font-weight:800; font-size:17px; color:#1d3457; }
    .global { color:var(--muted); font-size:13px; }
    .workspace { padding:20px 24px 32px; max-width:1400px; margin:auto; }
    .page-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    h1 { margin:0; font-size:22px; }
    .hint { color:var(--muted); font-size:13px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 2px 8px rgba(40,60,90,.03); }
    .channels { display:flex; gap:10px; padding:12px; margin-bottom:12px; overflow:auto; }
    .channel { min-width:210px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; text-align:left; }
    .channel.active { border-color:var(--blue); background:var(--blue-weak); box-shadow:0 0 0 1px var(--blue) inset; }
    .channel-title { display:flex; justify-content:space-between; font-weight:700; }
    .sub { color:var(--muted); font-size:12px; margin-top:2px; }
    .tag { display:inline-flex; align-items:center; padding:1px 7px; border-radius:10px; background:#f0f3f7; color:#5d6b7e; font-size:12px; white-space:nowrap; }
    .tag.green { color:var(--green); background:#edf8f0; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px; margin-bottom:12px; flex-wrap:wrap; }
    .toolbar-left,.toolbar-right,.inline { display:flex; align-items:center; gap:8px; }
    .segments { display:flex; background:#f0f3f7; border-radius:7px; padding:3px; }
    .segments button { border:0; background:transparent; color:#56657b; padding:6px 13px; border-radius:5px; }
    .segments button.active { background:#fff; color:var(--blue); font-weight:700; box-shadow:0 1px 4px rgba(35,50,80,.12); }
    select,input,textarea { border:1px solid #cfd8e6; border-radius:6px; padding:7px 9px; background:#fff; color:var(--text); }
    .btn { border:1px solid #cfd8e6; color:#34445f; background:#fff; border-radius:6px; padding:7px 12px; }
    .btn:hover:not(:disabled) { border-color:#8aa7db; color:var(--blue); }
    .btn.primary { border-color:var(--blue); background:var(--blue); color:#fff; }
    .btn.text { border-color:transparent; background:transparent; padding:4px 7px; color:var(--blue); }
    .btn.danger { color:var(--red); }
    .workbench { display:grid; grid-template-columns:235px minmax(0,1fr); min-height:550px; overflow:hidden; }
    .sections { border-right:1px solid var(--line); padding:14px 12px; }
    .panel-title { display:flex; align-items:center; justify-content:space-between; font-weight:700; margin-bottom:12px; gap:10px; }
    .section-row { display:flex; align-items:center; gap:6px; padding:9px 8px; margin-bottom:4px; border-radius:6px; cursor:pointer; }
    .section-row:hover,.section-row.active { background:var(--blue-weak); color:var(--blue); }
    .section-name { font-weight:600; }
    .section-count { color:var(--muted); font-size:12px; }
    .section-more { margin-left:auto; border:0; background:transparent; color:#66768c; font-size:18px; line-height:1; padding:2px 7px; border-radius:4px; }
    .table-panel { min-width:0; padding:14px; }
    .table-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; min-height:34px; }
    .table-title { font-weight:700; }
    .draft-actions { display:flex; align-items:center; gap:10px; }
    .table-wrap { border:1px solid var(--line); border-radius:8px; overflow:auto; }
    .pagination { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:12px; color:#59687e; flex-wrap:wrap; }
    .pagination .current-page { color:var(--muted); }
    table { width:100%; border-collapse:collapse; min-width:920px; }
    th { background:#f7f9fc; color:#59687e; text-align:left; padding:9px 10px; font-weight:600; white-space:nowrap; }
    td { padding:10px; border-top:1px solid var(--line); vertical-align:middle; }
    .product { display:flex; align-items:center; gap:9px; min-width:190px; }
    .photo { width:42px; height:42px; border-radius:7px; background:#fff4e7; display:grid; place-items:center; font-size:23px; flex:none; }
    .product-name { border:0; padding:0; color:var(--blue); background:transparent; font-weight:700; text-align:left; }
    .ok { color:var(--green); font-weight:600; }
    .bad { color:var(--red); font-weight:600; }
    .warn { color:var(--orange); font-weight:600; }
    .status-btn { border:0; background:transparent; padding:3px 0; }
    .more-btn { width:30px; height:30px; border:1px solid transparent; background:transparent; border-radius:5px; font-size:18px; }
    .more-btn:hover { border-color:var(--line); background:#f7f9fc; }
    .records { padding:14px; }
    .records table { min-width:760px; }
    .context-menu { position:fixed; z-index:50; width:150px; background:#fff; border:1px solid var(--line); border-radius:7px; box-shadow:var(--shadow); padding:5px; display:none; }
    .context-menu.open { display:block; }
    .context-menu button { width:100%; border:0; background:#fff; border-radius:5px; padding:8px 10px; text-align:left; }
    .context-menu button:hover:not(:disabled) { background:var(--blue-weak); color:var(--blue); }
    .context-menu button.danger { color:var(--red); }
    .mask { position:fixed; inset:0; background:rgba(28,41,61,.43); z-index:60; display:none; }
    .mask.open { display:block; }
    .drawer { position:fixed; top:0; right:0; bottom:0; width:min(700px,92vw); background:#fff; z-index:61; transform:translateX(100%); transition:transform .18s ease; display:flex; flex-direction:column; box-shadow:var(--shadow); visibility:hidden; pointer-events:none; }
    .drawer.wide { width:min(980px,96vw); }
    .drawer.open { transform:translateX(0); visibility:visible; pointer-events:auto; }
    .drawer-head { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); }
    .drawer-head h2 { margin:0; font-size:18px; }
    .drawer-body { padding:16px 18px; overflow:auto; flex:1; }
    .drawer-foot { padding:12px 18px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
    .notice { border:1px solid #cfe0ff; background:#f4f8ff; border-radius:7px; padding:10px 12px; margin-bottom:12px; }
    .notice.warnbox { border-color:#f2d39c; background:#fff9ed; }
    .form-row { margin-bottom:15px; }
    .form-row>label,.label { display:block; font-weight:700; margin-bottom:6px; }
    .form-row input[type=text],.form-row input[type=number],.form-row textarea { width:100%; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .surface-card { border:1px solid var(--line); border-radius:7px; padding:11px; margin-bottom:12px; }
    .shape-pill { display:inline-block; background:#eef4ff; color:var(--blue); border-radius:12px; padding:2px 8px; font-size:12px; }
    .spec-table { width:100%; min-width:0; }
    .spec-table td,.spec-table th { padding:8px; }
    .detail-summary { display:flex; align-items:center; gap:12px; padding:12px; margin-bottom:14px; border:1px solid #cfe0ff; background:#f4f8ff; border-radius:8px; }
    .detail-summary .photo { width:52px; height:52px; font-size:28px; }
    .detail-section { margin-bottom:16px; }
    .detail-section h3 { margin:0 0 8px; font-size:15px; }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 24px; margin:0; border:1px solid var(--line); border-radius:8px; padding:2px 12px; }
    .detail-pair { display:grid; grid-template-columns:112px 1fr; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
    .detail-pair:nth-last-child(-n+2) { border-bottom:0; }
    .detail-pair dt { color:var(--muted); }
    .detail-pair dd { margin:0; font-weight:600; }
    .detail-image { display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:8px; padding:12px; }
    .detail-status { border:1px solid var(--line); border-radius:8px; padding:12px; }
    .catalog-grid { display:grid; grid-template-columns:255px minmax(0,1fr); gap:14px; min-height:430px; }
    .category-box,.candidate-box { border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; }
    .tree ul { list-style:none; margin:4px 0 4px 20px; padding:0; }
    .tree li { margin:4px 0; }
    .tree button { border:0; background:transparent; padding:4px 5px; color:#40516b; text-align:left; }
    .tree button.active { color:var(--blue); background:var(--blue-weak); border-radius:5px; }
    .candidate { display:grid; grid-template-columns:24px minmax(180px,1fr) 135px 80px; gap:10px; align-items:center; padding:10px 6px; border-bottom:1px solid var(--line); }
    .candidate:last-child { border-bottom:0; }
    .menu-line { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
    .menu-line-actions { display:flex; align-items:center; justify-content:flex-end; gap:4px; flex-wrap:wrap; }
    .switch { display:inline-flex; align-items:center; gap:6px; color:#40516b; white-space:nowrap; }
    .switch input { appearance:none; width:34px; height:20px; margin:0; border:1px solid #b9c5d6; border-radius:12px; background:#c8d0dc; padding:0; position:relative; transition:.15s; }
    .switch input::before { content:""; position:absolute; width:14px; height:14px; top:2px; left:2px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(20,35,55,.25); transition:.15s; }
    .switch input:checked { border-color:var(--blue); background:var(--blue); }
    .switch input:checked::before { transform:translateX(14px); }
    .switch input:focus-visible { outline:2px solid #8fb3ff; outline-offset:2px; }
    .spec-price { width:92px; }
    .image-options { display:flex; gap:20px; margin-bottom:10px; }
    .image-editor { display:none; border:1px solid var(--line); border-radius:8px; padding:10px; }
    .image-editor.open { display:block; }
    .image-list { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .image-card { width:150px; border:1px solid var(--line); border-radius:7px; padding:8px; }
    .image-preview { height:80px; display:grid; place-items:center; background:#fff4e7; font-size:34px; border-radius:5px; margin-bottom:6px; }
    .image-actions { display:flex; flex-wrap:wrap; gap:2px; }
    .image-actions button { border:0; background:transparent; color:var(--blue); font-size:12px; padding:2px 4px; }
    .modal { position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; background:rgba(28,41,61,.43); }
    .modal.open { display:flex; }
    .dialog { width:min(500px,90vw); background:#fff; border-radius:10px; box-shadow:var(--shadow); }
    .dialog-head,.dialog-body,.dialog-foot { padding:15px 18px; }
    .dialog-head { border-bottom:1px solid var(--line); font-size:17px; font-weight:700; }
    .dialog-foot { border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
    .radio-stack label { display:block; border:1px solid var(--line); border-radius:7px; padding:10px; margin-bottom:8px; }
    .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); opacity:0; background:#26364d; color:#fff; border-radius:7px; padding:9px 15px; z-index:100; transition:.18s; pointer-events:none; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    @media(max-width:900px){ .workbench{grid-template-columns:1fr}.sections{border-right:0;border-bottom:1px solid var(--line)}.catalog-grid{grid-template-columns:1fr}.toolbar{align-items:flex-start}.grid2,.detail-grid{grid-template-columns:1fr}.detail-pair:nth-last-child(-n+2){border-bottom:1px solid var(--line)}.detail-pair:last-child{border-bottom:0} }
  </style>
</head>
<body>
  <div class="shell">
    <header class="appbar"><div class="brand">华润万象生活餐饮运营平台</div><div class="global">门店由全局工作区选择</div></header>
    <main class="workspace">
      <div class="page-head"><h1>门店销售菜单</h1><span class="hint">一个页面完成菜单编排、发布与销售控制</span></div>

      <section class="panel channels" aria-label="经营入口">
        <button class="channel active" data-channel="dinein" onclick="selectChannel(this)"><div class="channel-title"><span>堂食点单</span><span class="tag green">启用</span></div><div class="sub">内部堂食 · 2 份菜单</div></button>
        <button class="channel" data-channel="takeaway" onclick="selectChannel(this)"><div class="channel-title"><span>外带点单</span><span class="tag green">启用</span></div><div class="sub">内部外带 · 2 份菜单</div></button>
      </section>

      <section class="panel toolbar">
        <div class="toolbar-left">
          <div class="segments" aria-label="菜单模式">
            <button data-mode="front" onclick="setMode('front')">前台菜单</button>
            <button class="active" data-mode="draft" onclick="setMode('draft')">草稿菜单</button>
            <button data-mode="records" onclick="setMode('records')">操作记录</button>
          </div>
          <select id="menuSelect" aria-label="当前菜单" onchange="selectMenu(this.value)">
            <option value="dine">堂食菜单 · 有未发布修改</option>
            <option value="lunch">午市套餐 · 与前台一致</option>
          </select>
        </div>
        <div class="toolbar-right" id="menuActions">
          <button class="btn" onclick="openDrawer('schedule')">生效与时段</button>
          <button class="btn" onclick="openDrawer('menus')">管理菜单</button>
          <button class="btn primary" id="publishBtn" onclick="openDrawer('publish')">更新到前台</button>
        </div>
      </section>

      <section class="panel workbench" id="workbench">
        <aside class="sections">
          <div class="panel-title"><span>销售分区</span><button class="btn text" id="newSectionBtn" onclick="showToast('新建销售分区')">+ 新增</button></div>
          <div id="sectionRows"></div>
        </aside>
        <div class="table-panel">
          <div class="table-head">
            <div class="table-title"><span id="currentSection">招牌推荐</span> <span class="hint" id="itemCount"></span></div>
            <div class="draft-actions" id="draftActions"><span class="hint">正在编辑草稿，保存后仍需更新到前台</span><button class="btn" onclick="openDrawer('add')">添加商品到菜单</button></div>
          </div>
          <div class="table-wrap"><table><thead id="salesHead"></thead><tbody id="salesRows"></tbody></table></div>
          <div class="pagination" id="salesPagination" aria-label="销售项分页"></div>
        </div>
      </section>

      <section class="panel records" id="records" hidden>
        <div class="panel-title"><span>操作记录</span></div>
        <div class="table-wrap"><table><thead><tr><th>时间</th><th>操作</th><th>结果</th><th>操作人</th></tr></thead><tbody id="recordRows"></tbody></table></div>
        <div class="pagination" id="recordPagination" aria-label="操作记录分页"></div>
      </section>
    </main>
  </div>

  <div class="context-menu" id="contextMenu"></div>
  <div class="mask" id="mask" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer-head"><h2 id="drawerTitle"></h2><div class="inline"><button class="btn text danger" id="deleteSaleItemBtn" onclick="openDeleteSaleItem()" hidden>删除销售项</button><button class="btn text" onclick="closeDrawer()">关闭</button></div></div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>

  <div class="modal" id="saleModal" role="dialog" aria-modal="true" aria-labelledby="saleTitle">
    <div class="dialog">
      <div class="dialog-head" id="saleTitle">设置销售状态</div>
      <div class="dialog-body" id="saleBody"></div>
      <div class="dialog-foot"><button class="btn" onclick="closeSaleModal()">取消</button><button class="btn primary" id="modalConfirmBtn" onclick="confirmModal()">确认</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const state = { mode:'draft', channel:'dinein', menu:'dine', section:0, saleIndex:null, editIndex:null, modalKind:'sale', salesPage:1, salesPageSize:20, recordPage:1, recordPageSize:20 };
    const menus = [
      {key:'dine', name:'堂食菜单', enabled:true, time:'全天', draft:'草稿有修改'},
      {key:'lunch', name:'午市套餐', enabled:true, time:'11:00–14:00', draft:'与前台一致'}
    ];
    let sections = [
      {name:'招牌推荐', count:21}, {name:'主食', count:21}, {name:'小吃', count:21}, {name:'饮品', count:21}
    ];
    const items = [
      {icon:'🍗', name:'香辣鸡翅', code:'APP-CHICKEN-WINGS-001', shape:'按规格管理商品', shapeKey:'variant', spec:'原味、香辣', price:'¥46.00', defaultPrice:'商品默认 ¥48.00', constraint:'起售 1 份 · 按 1 份递增', inventory:'库存可售', manual:'正常销售', reason:''},
      {icon:'🍚', name:'米饭 · 大份', code:'RICE-001', shape:'按规格管理商品', shapeKey:'variant', spec:'大份', price:'¥5.00', defaultPrice:'', constraint:'起售 1 份 · 按 1 份递增', inventory:'库存可售', manual:'正常销售', reason:''},
      {icon:'🍚', name:'米饭 · 小份', code:'RICE-001', shape:'按规格管理商品', shapeKey:'variant', spec:'小份', price:'¥3.00', defaultPrice:'', constraint:'起售 1 份 · 按 1 份递增', inventory:'库存可售', manual:'正常销售', reason:''},
      {icon:'🥩', name:'鲜切牛肉', code:'WEIGHED-BEEF-001', shape:'称重销售商品', shapeKey:'weighted', spec:'无规格', price:'¥68.00 / 千克', defaultPrice:'', constraint:'不适用', inventory:'自动不可售 · 库存不足', manual:'正常销售', reason:''},
      {icon:'🥗', name:'凯撒沙拉', code:'CAESAR-001', shape:'普通销售商品', shapeKey:'standard', spec:'无规格', price:'¥38.00', defaultPrice:'', constraint:'起售 1 份 · 按 1 份递增', inventory:'库存可售', manual:'已沽清', reason:'设备维护'},
      {icon:'☕', name:'美式咖啡', code:'COFFEE-AMERICANO-001', shape:'普通销售商品', shapeKey:'standard', spec:'无规格', price:'¥22.00', defaultPrice:'', constraint:'起售 1 份 · 按 1 份递增', inventory:'库存可售', manual:'正常销售', reason:''},
      {icon:'🥛', name:'拿铁咖啡', code:'COFFEE-LATTE-001', shape:'普通销售商品', shapeKey:'standard', spec:'无规格', price:'¥28.00', defaultPrice:'', constraint:'起售 1 份 · 按 1 份递增', inventory:'库存可售', manual:'正常销售', reason:''},
      {icon:'🍊', name:'鲜榨橙汁', code:'JUICE-ORANGE-001', shape:'普通销售商品', shapeKey:'standard', spec:'无规格', price:'¥26.00', defaultPrice:'', constraint:'起售 1 份 · 按 1 份递增', inventory:'库存可售', manual:'正常销售', reason:''},
      {icon:'🍟', name:'香脆薯条', code:'FRIES-001', shape:'普通销售商品', shapeKey:'standard', spec:'无规格', price:'¥18.00', defaultPrice:'', constraint:'起售 1 份 · 按 1 份递增', inventory:'库存可售', manual:'正常销售', reason:''},
      {icon:'🍰', name:'巧克力蛋糕', code:'CAKE-CHOCOLATE-001', shape:'普通销售商品', shapeKey:'standard', spec:'无规格', price:'¥32.00', defaultPrice:'', constraint:'起售 1 份 · 按 1 份递增', inventory:'库存可售', manual:'正常销售', reason:''},
      {icon:'🍱', name:'双人套餐', code:'COMPOSITE-002', shape:'商品型套餐', shapeKey:'standard', spec:'无规格', price:'¥128.00', defaultPrice:'', constraint:'起售 1 份 · 按 1 份递增', inventory:'库存可售', manual:'正常销售', reason:''},
      ...Array.from({length:10},(_,index)=>({icon:'🍵',name:`分页示例商品 ${index+12}`,code:`PAGE-DEMO-${String(index+12).padStart(3,'0')}`,shape:'普通销售商品',shapeKey:'standard',spec:'无规格',price:`¥${20+index}.00`,defaultPrice:'',constraint:'起售 1 份 · 按 1 份递增',inventory:'库存可售',manual:'正常销售',reason:''}))
    ];

    const operationRecords = [
      {time:'2026-08-31 10:42',action:'更新堂食菜单到前台',result:'成功',actor:'门店商品专员'},
      {time:'2026-08-30 16:18',action:'修改午市套餐生效时段',result:'成功',actor:'店长'},
      {time:'2026-08-30 14:05',action:'人工沽清凯撒沙拉',result:'成功',actor:'值班经理'},

    function selectChannel(el){ document.querySelectorAll('.channel').forEach(x=>x.classList.remove('active')); el.classList.add('active'); state.channel=el.dataset.channel; state.salesPage=1; state.recordPage=1; state.mode==='records'?renderRecords():renderRows(); showToast('经营入口已更新，已回到第一页'); }
    function selectMenu(value){ state.menu=value; state.salesPage=1; state.recordPage=1; state.mode==='records'?renderRecords():renderRows(); showToast('已选择当前查看/编辑的菜单，已回到第一页'); }
    function currentMenu(){ return menus.find(menu=>menu.key===state.menu)||menus[0]; }
    function renderMenuOptions(){
      const select=document.getElementById('menuSelect');
      select.innerHTML=menus.map(menu=>`<option value="${menu.key}" ${menu.key===state.menu?'selected':''}>${menu.name} · ${menu.draft}</option>`).join('');
    }

    function setMode(mode){
      state.mode=mode;
      state.salesPage=1; state.recordPage=1;
      document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));
      const isRecords=mode==='records';
      document.getElementById('workbench').hidden=isRecords;
      document.getElementById('records').hidden=!isRecords;
      document.getElementById('publishBtn').disabled=mode!=='draft';
      if(isRecords) renderRecords(); else { renderSections(); renderRows(); }
    }

    function renderSections(){
      const draft=state.mode==='draft';
      document.getElementById('newSectionBtn').hidden=!draft;
      document.getElementById('sectionRows').innerHTML=sections.map((s,i)=>`<div class="section-row ${i===state.section?'active':''}" onclick="selectSection(${i})"><span class="section-name">${s.name}</span><span class="section-count">${s.count}</span>${draft?`<button class="section-more" aria-label="${s.name}操作" onclick="openContext(event,'section',${i})">…</button>`:''}</div>`).join('');
      document.getElementById('currentSection').textContent=sections[state.section].name;
    }
    function selectSection(i){ state.section=i; state.salesPage=1; renderSections(); renderRows(); }

    function renderRows(){
      document.getElementById('draftActions').hidden=state.mode!=='draft';
      const head=document.getElementById('salesHead'), body=document.getElementById('salesRows');
      document.getElementById('itemCount').textContent=`${items.length} 个销售项`;
      const totalPages=Math.max(1,Math.ceil(items.length/state.salesPageSize));
      state.salesPage=Math.min(state.salesPage,totalPages);
      const start=(state.salesPage-1)*state.salesPageSize;
      const visibleItems=items.slice(start,start+state.salesPageSize);
      if(state.mode==='draft'){
        head.innerHTML='<tr><th>菜单商品</th><th>商品形态</th><th>销售规格</th><th>挂牌价</th><th>销售约束</th><th>操作</th></tr>';
        body.innerHTML=visibleItems.map((p,localIndex)=>{const i=start+localIndex;return `<tr>
          <td>${productCell(p,i)}</td><td><span class="shape-pill">${p.shape}</span></td><td>${p.spec}</td>
          <td>${p.price}${p.defaultPrice?`<div class="sub">${p.defaultPrice}</div>`:''}</td><td>${p.constraint}</td>
          <td><button class="more-btn" aria-label="${p.name}操作" onclick="openContext(event,'item',${i})">…</button></td></tr>`}).join('');
      }else{
        head.innerHTML='<tr><th>菜单商品</th><th>商品形态</th><th>销售规格</th><th>挂牌价</th><th>库存状态</th><th>销售状态</th></tr>';
        body.innerHTML=visibleItems.map((p,localIndex)=>{const i=start+localIndex;return `<tr>
          <td>${productCell(p,i)}</td><td><span class="shape-pill">${p.shape}</span></td><td>${p.spec}</td><td>${p.price}</td>
          <td class="${p.inventory.startsWith('自动')?'bad':'ok'}">${p.inventory}</td>
          <td><button class="status-btn ${p.manual==='正常销售'?'ok':'warn'}" onclick="openSaleState(${i})">${p.manual}${p.reason?` · ${p.reason}`:''}</button></td></tr>`}).join('');
      }
      renderSalesPagination();
    }
    function productCell(p,i){ return `<div class="product"><div class="photo">${p.icon}</div><div><button class="product-name" onclick="openDrawer('item',${i},${state.mode==='front'})">${p.name}</button><div class="sub">${p.code}</div></div></div>`; }

    function renderSalesPagination(){
      const totalPages=Math.max(1,Math.ceil(items.length/state.salesPageSize));
      document.getElementById('salesPagination').innerHTML=`<button class="btn" aria-label="销售项上一页" ${state.salesPage===1?'disabled':''} onclick="changeSalesPage(${state.salesPage-1})">上一页</button><span class="current-page">第 ${state.salesPage} 页</span><button class="btn" aria-label="销售项下一页" ${state.salesPage===totalPages?'disabled':''} onclick="changeSalesPage(${state.salesPage+1})">下一页</button>`;
    }
    function changeSalesPage(page){ state.salesPage=Math.max(1,page); renderRows(); }

    function renderRecords(){
      const total=operationRecords.length, totalPages=Math.max(1,Math.ceil(total/state.recordPageSize));
      state.recordPage=Math.min(state.recordPage,totalPages);
      const start=(state.recordPage-1)*state.recordPageSize;
      document.getElementById('recordRows').innerHTML=operationRecords.slice(start,start+state.recordPageSize).map(row=>`<tr><td>${row.time}</td><td>${row.action}</td><td class="ok">${row.result}</td><td>${row.actor}</td></tr>`).join('');
      document.getElementById('recordPagination').innerHTML=`<button class="btn" aria-label="操作记录上一页" ${state.recordPage===1?'disabled':''} onclick="changeRecordPage(${state.recordPage-1})">上一页</button><span class="current-page">第 ${state.recordPage} 页</span><button class="btn" aria-label="操作记录下一页" ${state.recordPage===totalPages?'disabled':''} onclick="changeRecordPage(${state.recordPage+1})">下一页</button>`;
    }
    function changeRecordPage(page){ state.recordPage=Math.max(1,page); renderRecords(); }

    function openContext(event,type,index){
      event.stopPropagation(); const menu=document.getElementById('contextMenu');
      const length=type==='section'?sections.length:items.length;
      menu.innerHTML=`<button ${index===0?'disabled':''} onclick="moveRow('${type}',${index},-1)">上移</button><button ${index===length-1?'disabled':''} onclick="moveRow('${type}',${index},1)">下移</button>${type==='section'?'<button onclick="showToast(\'重命名销售分区\');closeContext()">重命名</button><button class="danger" onclick="showToast(\'删除前将明确影响范围\');closeContext()">删除</button>':''}`;
      menu.style.left=Math.min(event.clientX,window.innerWidth-165)+'px'; menu.style.top=Math.min(event.clientY,window.innerHeight-190)+'px'; menu.classList.add('open');
    }
    function closeContext(){ document.getElementById('contextMenu').classList.remove('open'); }
    function moveRow(type,index,delta){
      const arr=type==='section'?sections:items, next=index+delta; if(next<0||next>=arr.length)return;
      [arr[index],arr[next]]=[arr[next],arr[index]]; if(type==='section')state.section=next;
      closeContext(); renderSections(); renderRows(); showToast('顺序已保存，并按权威读回结果刷新');
    }
    document.addEventListener('click',e=>{ if(!e.target.closest('.context-menu')&&!e.target.closest('.more-btn')&&!e.target.closest('.section-more'))closeContext(); });

    function openDrawer(type,payload=0,readonly=false){

        const menu=currentMenu();

          <div class="surface-card"><b>当前状态：${menu.enabled?'已启用':'已停用'}</b><div class="sub">启用或停用请在“管理菜单”中操作；停用不影响编辑和更新到前台。</div></div>

        foot.innerHTML='<button class="btn" onclick="closeDrawer()">取消</button><button class="btn primary" onclick="showToast(\'生效与时段已保存，更新到前台后生效\');closeDrawer()">保存</button>';
      }
      if(type==='add'){
        title.textContent='添加商品到菜单'; body.innerHTML=`<div class="notice">加入到销售分区：<b>${sections[state.section].name}</b>。商品分类只用于查找商品。</div>
          <div class="catalog-grid"><div class="category-box"><div class="panel-title">完整商品分类树</div><div class="tree">
            <ul><li><button class="active">全部商品</button></li><li>▾ 餐食<ul><li>▾ 主食<ul><li><button>米饭</button></li><li><button>面食</button></li></ul></li><li><button>前菜</button></li><li><button>小吃</button></li><li><button>套餐</button></li></ul></li><li>▾ 饮品<ul><li><button>咖啡</button></li><li><button>茶饮</button></li><li><button>其他饮品</button></li></ul></li><li>▾ 零售商品<ul><li><button>预包装食品</button></li><li><button>周边商品</button></li></ul></li><li>▾ 原材料与耗材<ul><li><button>原材料</button></li><li><button>半成品</button></li><li><button>包装物</button></li></ul></li></ul>
          </div></div><div class="candidate-box"><div class="panel-title"><span>可编入商品</span><input aria-label="搜索商品" placeholder="搜索商品名称/编码"/></div>
            ${candidate('🍞','蒜香面包','APP-GARLIC-BREAD-001','普通销售商品','餐食 / 小吃','¥18.00','')}
            ${candidate('🍚','米饭','RICE-001','按规格管理商品','餐食 / 主食','¥3.00 起','当前菜单已有 2 个销售项，仍可继续添加')}
            ${candidate('🍗','香辣鸡翅','APP-CHICKEN-WINGS-001','按规格管理商品','餐食 / 小吃','¥48.00','当前菜单已有 1 个销售项，仍可继续添加')}
            ${candidate('🥩','鲜切牛肉','WEIGHED-BEEF-001','称重销售商品','餐食 / 主食','¥68.00/千克','')}
            ${candidate('🍱','双人套餐','COMPOSITE-002','商品型套餐','餐食 / 套餐','¥128.00','')}
          </div></div>`;
        foot.innerHTML='<button class="btn" onclick="closeDrawer()">取消</button><button class="btn primary" onclick="showToast(\'已新建独立销售项，可继续编辑规格与价格\');closeDrawer()">加入所选商品</button>';
      }
      if(type==='item'){
        const p=items[payload], ro=readonly||state.mode==='front';
        state.editIndex=payload; deleteButton.hidden=ro;
        title.textContent=ro?'查看销售项':'编辑销售项';
        if(ro){
          body.innerHTML=readonlyItemDetail(p);
          foot.innerHTML='<button class="btn primary" onclick="closeDrawer()">关闭</button>';
        }else{
          body.innerHTML=`<div class="notice"><b>${p.name}</b> · ${p.code}　<span class="shape-pill">${p.shape}</span></div>
            <div class="form-row"><label for="displayName">菜单展示名称</label><input id="displayName" name="displayName" type="text" value="${p.name}"/></div>
            ${saleContent(p,false)}
            ${p.shapeKey==='variant'?'':commonPriceContent(p,false)}
            ${p.shapeKey==='weighted'?'<div class="notice warnbox"><b>销售约束不适用</b><br/>当前起售量与订购倍数按“份”定义，称重销售商品不展示这两项；未来如需最小重量或重量步进，应另行定义语义。</div>':`<div class="grid2"><div class="form-row"><label for="minimumQuantity">起售量（份）</label><input id="minimumQuantity" name="minimumQuantity" type="number" value="1"/></div><div class="form-row"><label for="quantityStep">订购倍数（份）</label><input id="quantityStep" name="quantityStep" type="number" value="1"/></div></div>`}
            <div class="form-row"><span class="label">展示图片</span><div class="image-options"><label><input type="radio" name="imageMode" checked onchange="toggleImageEditor(false)"/> 沿用商品图片</label><label><input type="radio" name="imageMode" onchange="toggleImageEditor(true)"/> 单独设置</label></div><div class="sub">沿用时会随商品图片变化；单独设置只影响当前销售项。</div>

                ${imageCard(p.icon,'主图',0)}${imageCard('📷','附图',1)}

            </div>`;
          foot.innerHTML='<button class="btn" onclick="closeDrawer()">取消</button><button class="btn primary" onclick="showToast(\'销售项已保存，仍需更新到前台\');closeDrawer()">保存</button>';
        }

      if(type==='publish'){
        const menu=currentMenu();
        title.textContent='更新到前台'; body.innerHTML=`<div class="notice"><b>${menu.name}</b> · 当前草稿<br/>4 个销售分区 · ${items.length} 个销售项</div><div class="surface-card"><b>发布前检查</b><p class="${menu.enabled?'ok':'warn'}">菜单当前${menu.enabled?'已启用':'已停用'}${menu.enabled?'':'；停用不阻断更新到前台'}</p><p class="ok">销售分区和销售项完整</p><p class="ok">生效时段设置有效</p></div><div class="notice warnbox">成功只表示本系统生成新的前台菜单，不代表收银端、扫码端或自助机已经获取。</div>`;
        foot.innerHTML='<button class="btn" onclick="closeDrawer()">取消</button><button class="btn primary" onclick="finishPublish()">更新到前台</button>';
      }
      document.getElementById('mask').classList.add('open'); drawer.classList.add('open'); setTimeout(()=>document.getElementById('drawerTitle').focus?.(),0);
    }
    function candidate(icon,name,code,shape,category,price,note){ return `<label class="candidate"><input type="checkbox" name="candidate" value="${code}"/><div><b>${icon} ${name}</b><div class="sub">${code} · ${category}</div>${note?`<div class="sub">${note}</div>`:''}</div><span class="shape-pill">${shape}</span><span>${price}</span></label>`; }
    function commonPriceContent(p,ro){
      return `<div class="grid2"><div class="form-row"><label for="listedPrice">挂牌价</label><input id="listedPrice" name="listedPrice" type="text" value="${p.price.replace('¥','')}" ${ro?'disabled':''}/></div><div class="form-row"><label for="defaultPrice">商品默认价</label><input id="defaultPrice" name="defaultPrice" type="text" value="${p.defaultPrice||p.price}" disabled/></div></div>`;
    }
    function variantSpecs(p){
      return p.code==='RICE-001'
        ? [{name:'大份',code:'RICE-LARGE',defaultPrice:'4.00',listedPrice:'5.00',checked:p.spec==='大份'},{name:'小份',code:'RICE-SMALL',defaultPrice:'2.50',listedPrice:'3.00',checked:p.spec==='小份'}]
        : [{name:'原味',code:'WINGS-ORIGINAL',defaultPrice:'48.00',listedPrice:'46.00',checked:true},{name:'香辣',code:'WINGS-SPICY',defaultPrice:'48.00',listedPrice:'46.00',checked:true}];
    }
    function saleContent(p,ro){
      if(p.shapeKey==='variant') {
        const specs=variantSpecs(p);
        const rows=specs.map(s=>`<tr><td><input type="checkbox" name="specScope" value="${s.code}" aria-label="选择规格${s.name}" ${s.checked?'checked':''} ${ro?'disabled':''}/></td><td>${s.name}</td><td>${s.code}</td><td class="ok">启用</td><td>¥${s.defaultPrice}</td><td><span>¥ </span><input class="spec-price" type="text" name="specListedPrice" aria-label="${s.name}菜单挂牌价" value="${s.listedPrice}" ${ro?'disabled':''}/></td></tr>`).join('');
        return `<div class="form-row"><span class="label">销售规格与价格</span><div class="surface-card"><div class="sub" style="margin-bottom:7px">选择当前销售项开放的具体规格，并分别设置菜单挂牌价；目录新增规格不会自动加入已发布菜单。</div><table class="spec-table"><thead><tr><th></th><th>规格</th><th>规格编码</th><th>状态</th><th>商品默认价</th><th>菜单挂牌价</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
      }
      if(p.shapeKey==='weighted') return '<div class="form-row"><span class="label">销售内容</span><div class="surface-card">称重销售商品没有规格，销售数量按商品的有效销售单位录入。</div></div>';
      return `<div class="form-row"><span class="label">销售内容</span><div class="surface-card">该商品没有规格，销售项直接使用商品。</div></div>`;
    }
    function readonlyItemDetail(p){
      const priceDetail=p.shapeKey==='variant'
        ? `<table class="spec-table"><thead><tr><th>规格</th><th>规格编码</th><th>商品默认价</th><th>菜单挂牌价</th></tr></thead><tbody>${variantSpecs(p).filter(spec=>spec.checked).map(spec=>`<tr><td>${spec.name}</td><td>${spec.code}</td><td>¥${spec.defaultPrice}</td><td>¥${spec.listedPrice}</td></tr>`).join('')}</tbody></table>`
        : `<dl class="detail-grid"><div class="detail-pair"><dt>销售内容</dt><dd>${p.shapeKey==='weighted'?'按有效销售单位称重销售':'无规格，直接销售该商品'}</dd></div><div class="detail-pair"><dt>菜单挂牌价</dt><dd>${p.price}</dd></div><div class="detail-pair"><dt>商品默认价</dt><dd>${p.defaultPrice||p.price}</dd></div></dl>`;
      const constraints=p.shapeKey==='weighted'
        ? '<div class="detail-status"><b>不适用</b><div class="sub">当前起售量与订购倍数按“份”定义，不适用于称重销售商品。</div></div>'
        : '<dl class="detail-grid"><div class="detail-pair"><dt>起售量</dt><dd>1 份</dd></div><div class="detail-pair"><dt>订购倍数</dt><dd>1 份</dd></div></dl>';
      return `<div class="detail-summary"><div class="photo">${p.icon}</div><div><b>${p.name}</b><div class="sub">${p.code}</div><span class="shape-pill">${p.shape}</span></div></div>
        <section class="detail-section"><h3>菜单定义</h3><dl class="detail-grid"><div class="detail-pair"><dt>菜单展示名称</dt><dd>${p.name}</dd></div><div class="detail-pair"><dt>销售规格</dt><dd>${p.spec}</dd></div></dl></section>
        <section class="detail-section"><h3>销售规格与价格</h3>${priceDetail}</section>
        <section class="detail-section"><h3>销售约束</h3>${constraints}</section>
        <section class="detail-section"><h3>展示图片</h3><div class="detail-image"><div class="photo">${p.icon}</div><div><b>沿用商品图片</b><div class="sub">当前前台菜单展示这张商品主图</div></div></div></section>
        <section class="detail-section"><h3>当前销售事实</h3><div class="grid2"><div class="detail-status"><b>库存状态</b><div class="${p.inventory.startsWith('自动')?'bad':'ok'}">${p.inventory}</div><div class="sub">库存驱动，库存恢复后自动恢复</div></div><div class="detail-status"><b>销售状态</b><div class="${p.manual==='正常销售'?'ok':'warn'}">${p.manual}${p.reason?` · ${p.reason}`:''}</div><div class="sub">人工控制，与库存状态分别展示</div></div></div></section>`;
    }
    function imageCard(icon,label,index){ return `<div class="image-card"><div class="image-preview">${icon}</div><b>${label}</b><div class="image-actions"><button ${index===0?'disabled':''}>上移</button><button ${index===1?'disabled':''}>下移</button><button>${index===0?'当前主图':'设为主图'}</button><button>删除</button></div></div>`; }

    function closeDrawer(){ document.getElementById('mask').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }
    function finishPublish(){ closeDrawer(); setMode('front'); showToast('本系统已生成新的前台菜单'); }

    function renderManageMenus(){
      document.getElementById('drawerBody').innerHTML=`<div class="notice">菜单选择器只选择当前查看/编辑对象，不代表启用或停用。停用菜单不影响继续编辑和更新到前台。</div><button class="btn primary">新建菜单</button>
        ${menus.map(menu=>`<div class="menu-line"><div><b>${menu.name}</b><div class="sub">${menu.draft} · ${menu.enabled?'已启用':'已停用'} · ${menu.time}</div></div><div class="menu-line-actions"><label class="switch"><input type="checkbox" role="switch" aria-label="${menu.enabled?'停用':'启用'}${menu.name}" ${menu.enabled?'checked':''} onchange="toggleMenuEnabled('${menu.key}',this.checked)"/> ${menu.enabled?'启用':'停用'}</label><button class="btn text" onclick="copyMenu('${menu.key}')">复制</button><button class="btn text">改名</button><button class="btn text danger">归档</button></div></div>`).join('')}`;
    }
    function toggleMenuEnabled(key,enabled){
      const menu=menus.find(item=>item.key===key); if(!menu)return;
      menu.enabled=enabled; renderManageMenus(); showToast(`${menu.name}已${enabled?'启用':'停用'}；仍可编辑和更新到前台`);
    }
    function copyMenu(key){
      const source=menus.find(item=>item.key===key); if(!source)return;
      const baseName=`${source.name} 副本`; let name=baseName, suffix=2;
      while(menus.some(item=>item.name===name)) name=`${baseName} ${suffix++}`;
      const copy={key:`copy-${Date.now()}`,name,enabled:false,time:source.time,draft:'新副本 · 未发布'};
      menus.push(copy); state.menu=copy.key; renderMenuOptions(); renderManageMenus(); showToast(`已生成${name}并选中；副本默认停用`);
    }

    function openSaleState(index){
      state.modalKind='sale'; state.saleIndex=index; const p=items[index]; document.getElementById('saleTitle').textContent='设置销售状态';
      const confirm=document.getElementById('modalConfirmBtn'); confirm.textContent='确认'; confirm.className='btn primary';
      document.getElementById('saleBody').innerHTML=`<div class="notice"><b>${p.name}</b> · ${p.spec}<br/><span class="sub">${state.channel==='dinein'?'堂食点单':'外带点单'}；库存状态不在此处修改。</span></div><div class="radio-stack"><label><input type="radio" name="saleState" value="normal" ${p.manual==='正常销售'?'checked':''} onchange="toggleReason(false)"/> 正常销售</label><label><input type="radio" name="saleState" value="soldout" ${p.manual==='已沽清'?'checked':''} onchange="toggleReason(true)"/> 人工沽清</label></div><div class="form-row" id="reasonRow" ${p.manual==='正常销售'?'hidden':''}><label for="saleReason">沽清原因（必填）</label><textarea id="saleReason" name="saleReason" rows="3">${p.reason}</textarea></div>${p.manual==='已沽清'?'<div class="notice warnbox">恢复正常销售需要再次确认；库存自动不可售不会因此恢复。</div>':''}`;
      document.getElementById('saleModal').classList.add('open');
    }
    function openDeleteSaleItem(){
      const p=items[state.editIndex]; if(!p)return;
      state.modalKind='delete'; document.getElementById('saleTitle').textContent='删除销售项';
      document.getElementById('saleBody').innerHTML=`<div class="notice warnbox">确认从当前菜单草稿的“${sections[state.section].name}”分区删除销售项 <b>${p.name}</b>？<br/><span class="sub">只删除这个销售项，不删除商品，也不影响同一商品在其他分区或本分区中的其他销售项。</span></div>`;
      const confirm=document.getElementById('modalConfirmBtn'); confirm.textContent='删除'; confirm.className='btn danger';
      document.getElementById('saleModal').classList.add('open');
    }
    function toggleReason(show){ document.getElementById('reasonRow').hidden=!show; }
    function closeSaleModal(){ document.getElementById('saleModal').classList.remove('open'); }
    function confirmModal(){
      if(state.modalKind==='delete'){
        const removed=items.splice(state.editIndex,1)[0];
        sections[state.section].count=Math.max(0,sections[state.section].count-1);
        closeSaleModal(); closeDrawer(); renderSections(); renderRows(); showToast(`已从当前草稿删除销售项：${removed.name}`); return;
      }
      const choice=document.querySelector('input[name=saleState]:checked').value, p=items[state.saleIndex], reason=document.getElementById('saleReason')?.value.trim()||'';
      if(choice==='soldout'&&!reason){ showToast('请填写沽清原因'); return; }
      p.manual=choice==='soldout'?'已沽清':'正常销售'; p.reason=choice==='soldout'?reason:''; closeSaleModal(); renderRows(); showToast(choice==='soldout'?'已人工沽清':'已恢复正常销售');
    }
    let toastTimer; function showToast(message){ const el=document.getElementById('toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800); }
    renderMenuOptions(); renderSections(); renderRows(); renderRecords();
  </script>
</body>
</html>
