<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    .bg{fill:#eef2f7}.surface{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1}.line{stroke:#dbe3ee}.primary{fill:#e8f0ff;stroke:#4f7cff}.selected{fill:#dbeafe}.disabled{fill:#f1f5f9}.h1{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#162033}.h2{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#24324a}.t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}.s{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#64748b}.note{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#7c3aed}.bad{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#be123c}.btn{fill:#fff;stroke:#94a3b8}.pbtn{fill:#1d4ed8}.white{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#fff}
  </style>
  <rect class="bg" width="1600" height="900"/>
  <text class="h1" x="46" y="54">商品分类选择：所有场景使用同一棵树</text>
  <text class="note" x="46" y="82">设计注释：示例名称只表达层级；真实名称、顺序、可选性和原因全部来自分类 owner。</text>

  <rect class="surface" x="38" y="106" width="900" height="748" rx="10"/>
  <text class="h2" x="70" y="148">新建商品</text><text class="s" x="70" y="174">先建立商品身份，分类按业务层级选择</text>
  <text class="t" x="70" y="220">商品名称 *</text><rect class="panel" x="70" y="234" width="360" height="40" rx="6"/><text class="t" x="88" y="260">精品拿铁</text>
  <text class="t" x="462" y="220">商品类型 *</text><rect class="panel" x="462" y="234" width="240" height="40" rx="6"/><text class="t" x="480" y="260">按规格管理商品</text>
  <text class="t" x="70" y="316">商品分类</text>
  <rect class="primary" x="70" y="330" width="632" height="44" rx="6"/><text class="t" x="88" y="357">餐饮商品 / 饮品 / 咖啡饮品</text><text class="t" x="674" y="357">⌄</text>
  <rect class="surface" x="70" y="382" width="632" height="404" rx="7" stroke="#4f7cff"/>
  <rect class="panel" x="88" y="400" width="596" height="38" rx="6"/><text class="s" x="106" y="424">搜索分类名称或编码</text>
  <text class="t" x="104" y="474">▾ 餐饮商品</text>
  <text class="t" x="132" y="512">▾ 饮品</text>
  <rect class="selected" x="152" y="528" width="500" height="38" rx="5"/><text class="t" x="170" y="553">✓ 咖啡饮品</text>
  <text class="t" x="170" y="596">茶饮</text>
  <text class="t" x="132" y="636">主菜</text><text class="t" x="132" y="676">小吃</text>
  <text class="t" x="104" y="720">▸ 物料</text><text class="t" x="104" y="758">▸ 服务与权益</text>
  <text class="s" x="724" y="350">选择后持续显示完整路径，</text><text class="s" x="724" y="372">不能只显示末级“咖啡饮品”。</text>
  <rect class="btn" x="724" y="784" width="88" height="38" rx="6"/><text class="t" x="754" y="808">取消</text><rect class="pbtn" x="822" y="784" width="88" height="38" rx="6"/><text class="white" x="840" y="808">继续完善</text>

  <rect class="surface" x="966" y="106" width="596" height="748" rx="10"/>
  <text class="h2" x="998" y="148">同一控件覆盖全部分类赋值任务</text>
  <rect class="panel" x="998" y="178" width="532" height="118" rx="8"/><text class="note" x="1018" y="206">编辑商品</text><text class="t" x="1018" y="240">商品分类</text><rect class="surface" x="1128" y="220" width="374" height="44" rx="6" stroke="#94a3b8"/><text class="t" x="1146" y="247">餐饮商品 / 饮品 / 咖啡饮品　⌄</text>
  <rect class="panel" x="998" y="316" width="532" height="118" rx="8"/><text class="note" x="1018" y="344">批量改分类</text><text class="t" x="1018" y="378">目标分类</text><rect class="surface" x="1128" y="358" width="374" height="44" rx="6" stroke="#94a3b8"/><text class="t" x="1146" y="385">餐饮商品 / 饮品 / 咖啡饮品　⌄</text>
  <rect class="panel" x="998" y="454" width="532" height="170" rx="8"/><text class="note" x="1018" y="482">移动分类</text><text class="t" x="1018" y="516">上级分类</text><rect class="surface" x="1128" y="496" width="374" height="44" rx="6" stroke="#94a3b8"/><text class="t" x="1146" y="523">餐饮商品 / 饮品　⌄</text><rect class="disabled" x="1018" y="554" width="484" height="48" rx="6"/><text class="bad" x="1034" y="576">当前分类及其下级不可选</text><text class="s" x="1034" y="594">避免把分类移动到自己或自己的下级中</text>
  <rect class="primary" x="998" y="650" width="532" height="152" rx="8"/><text class="h2" x="1018" y="682">共同规则</text><text class="t" x="1018" y="714">• 单选，但必须保留树结构</text><text class="t" x="1018" y="744">• 搜索命中后仍显示祖先路径</text><text class="t" x="1018" y="774">• 不可选节点直接显示业务原因</text>
</svg>
